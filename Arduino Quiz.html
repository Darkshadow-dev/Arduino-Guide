<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="Images/Website-Guide.png">
<title>Arduino Quiz Hub</title>

<style>
:root{
  --bg:#f5faff;
  --panel:#ffffff;
  --accent:#00979d;
  --accent2:#00c853;
  --text:#0b1c2d;
}

/* ===== RESET ===== */
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:system-ui,Arial;
  background:var(--bg);
  color:var(--text);
}

/* ===== LAYOUT ===== */
#app{
  display:flex;
  height:100vh;
}

/* ===== SIDEBAR ===== */
#sidebar{
  width:220px;
  background:#050814;
  color:#aaa;
}

#sidebar h2{
  text-align:center;
  padding:12px;
  border-bottom:1px solid #222;
}

.cat{
  width:100%;
  padding:12px;
  background:none;
  border:none;
  color:#aaa;
  cursor:pointer;
  text-align:left;
}

.cat:hover,
.cat.active{
  background:#1a2cff;
  color:#fff;
}

/* ===== MAIN ===== */
#main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* ===== TOPBAR ===== */
#topbar{
  min-height:50px;
  max-height:50px;
  background:#050814;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}

nav{
  display:flex;
  gap:10px;
}

nav a{
  color:#00cfff;
  text-decoration:none;
  padding:6px 10px;
}

nav a:hover{
  background:rgba(0,151,157,.2);
  border-radius:6px;
}

/* ===== CONTENT ===== */
#mainContent{
  padding:20px;
  overflow:auto;
}

/* ===== QUIZ ===== */
.question{
  background:var(--panel);
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.answers button{
  width:100%;
  margin:6px 0;
  padding:10px;

  border:none;
  border-radius:10px;

  background:linear-gradient(145deg,#eef6ff,#dceeff);
  cursor:pointer;
  font-weight:600;

  transition:.2s;
}

.answers button:hover{
  transform:translateY(-2px);
  background:#cfe9ff;
}

.answers button.selected{
  background:#00979d;
  color:white;
}

.answers button.correct{
  background:#00c853;
  color:white;
}

.answers button.wrong{
  background:#ff5252;
  color:white;
}

.correct{background:#d4f8d4;}
.wrong{background:#ffd6d6;}

#quizSelect{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:16px;
}

#quizSelect button{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  background:#e6f7ff;
  cursor:pointer;
  font-weight:600;
  transition:.2s;
}

#quizSelect button:hover{
  background:#ccefff;
  transform:translateY(-1px);
}

#quizSelect button.active{
  background:#00979d;
  color:white;
}

.question{
  background:white;
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.question.correct{background:#d4f8d4;}
.question.wrong{background:#ffd6d6;}
.question.partial{background:#fff3cd;}

.question input,
.question textarea{
  margin-top:6px;
  padding:6px;
  width:100%;
  border-radius:6px;
  border:1px solid #ccc;
}

.answers label{
  display:block;
  margin:4px 0;
  cursor:pointer;
}

/* ===== BUTTONS ===== */
#controls{
  margin-top:20px;
}

#controls button{
  padding:10px 16px;
  border:none;
  background:#1a2cff;
  color:white;
  cursor:pointer;
  margin-right:10px;
}

#controls button:disabled{
  opacity:0.5;
  cursor:not-allowed;
}

#rankBox{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:bold;
}
#quizSelect button.red{
  background:#ff5252;
  color:white;
}

#quizSelect button.yellow{
  background:#ffd54f;
  color:black;
}

#quizSelect button.green{
  background:#00c853;
  color:white;
}
::-webkit-scrollbar{display:none}
/* HEADER TITLE */
.headerTitle{
  font-weight:bold;
  font-size:18px;
}
#codeUnlocks{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.codeBtn{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#222;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.codeBtn.locked{
  background:#555;
  cursor:not-allowed;
  opacity:0.6;
}

.codeArea textarea{
  width:100%;
  min-height:150px;
  max-height:550px;
  margin-top:10px;
  font-family:monospace;
}

.codeArea input{
  width:100%;
  margin-top:6px;
}
/* ================= GLOBAL RESPONSIVE (NO LAYOUT BREAK) ================= */

/* shrink sidebar slightly on small screens */
@media(max-width:1100px){
  #sidebar{
    width:180px;
  }
}

/* smaller spacing for tablets */
@media(max-width:900px){

  #topbar{
    padding:8px 10px;
  }

  nav a{
    font-size:13px;
    padding:5px 8px;
  }

  #mainContent{
    padding:12px;
  }

  .question{
    padding:10px;
  }

  .answers button{
    padding:10px;
    font-size:14px;
  }
}

/* mobile — SAME LAYOUT, just tighter */
@media(max-width:600px){

  #sidebar{
    width:150px;
  }

  #sidebar h2{
    font-size:14px;
  }

  .cat{
    font-size:12px;
    padding:8px;
  }

  #topbar{
    min-height:40px;
    max-height:40px;
    font-size:14px;
  }

  nav{
    gap:4px;
  }

  nav a{
    font-size:12px;
    padding:4px 6px;
  }

  #mainContent{
    padding:8px;
  }

  #quizSelect{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:6px;
  }

  #quizSelect button{
    font-size:12px;
    padding:8px;
  }

  .answers button{
    padding:10px;
    font-size:13px;
  }
}


#editorWrap{
  display:flex;
  height:calc(100vh - 120px);
}

/* LEFT LINE NUMBERS */
#lineNums{
  width:50px;
  padding:10px 5px;
  color:#666;
  text-align:right;
  font-size:14px;
  line-height:1.4;
  overflow:hidden;
}

/* EDITOR BOX */
#editorBox{
  position:relative;
  flex:1;
}

/* BOTH LAYERS */
#editor, #highlight{
  position:absolute;
  inset:0;
  font-family:monospace;
  font-size:14px;
  line-height:1.4;
  padding:10px;
  white-space:pre-wrap;
  word-wrap:break-word;
  overflow:auto;
  margin:0;
  border:none;
}

/* SYNTAX LAYER */
#highlight{
  pointer-events:none;
  z-index:1;
}

/* TEXT INPUT */
#editor{
  background:transparent;
  color:transparent;
  caret-color:#0865bd;
  z-index:2;
  resize:none;
  outline:none;
}

</style>
</head>

<body>

<div id="app">

<!-- ===== SIDEBAR ===== -->
<div id="sidebar">
  <h2>QUIZ HUB</h2>
<div class="sideSection">
<div class="live-counter" id="liveCounter">
  <span class="dot"></span>
  Online: <span id="onlineCount">0</span>
</div>
  <h3>Rank</h3>
  <p id="rankBox">
    <img src="Images/Rank/rank_beginner.png" style="width:16px;height:16px;vertical-align:middle;margin-right:6px;">
    Beginner
  </p>
</div>
  <button class="cat active" onclick="loadCategory('pins',this)">Pins</button>
  <button class="cat" onclick="loadCategory('hardware',this)">Hardware</button>
  <button class="cat" onclick="loadCategory('software',this)">Software</button>
<hr style="border:1px solid #222; width:100%;">

<div id="sidebarQuizzes"></div>
</div>

<!-- ===== MAIN ===== -->
<div id="main">

  <div id="topbar">
    <div>Arduino Quiz</div>
    <nav>
      <a href="Arduino%20Guide.html#home">Home</a>
      <a href="Examples.html#examples">Examples</a>
      <a href="https://darkshadow-dev.github.io/community/Arduino%20Community.html">Community</a>
      <a href="Arduino%20Code.html">Code Beta</a>
    </nav>
  </div>

  <div id="mainContent">

    <h2 id="title">Pins</h2>

    <div id="quizSelect"></div>
<div id="codeUnlocks"></div>
    <div id="quizArea"></div>

    <div id="controls">
      <button id="submitBtn" onclick="submitQuiz()">Submit</button>
    <!--<button id="retakeBtn" onclick="retake()" disabled>Retake</button>-->
    </div>
<h3 id="scoreBox"></h3>

  </div>

</div>
</div>
<script src="js/Quizes.js"></script>
<script>

let currentQuiz = [];

// ===== LOAD CATEGORY =====
function loadCategory(category, btn){
mode = "quiz";
document.getElementById("quizSelect").style.display = "flex";
document.getElementById("controls").style.display = "block";
document.getElementById("quizArea").innerHTML = "";
  currentCategory = category;
  currentQuizIndex = 0;
  userAnswers = Array.from({ length: data[category].length }, () => []);
  totalQuestions = data[category].length;

  // Highlight active button
  document.querySelectorAll('#sidebar .cat').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');

  // Set title
  document.getElementById('title').textContent = category.charAt(0).toUpperCase() + category.slice(1);

  // Render quiz select buttons
  const qs = document.getElementById('quizSelect');
  qs.innerHTML = '';
data[category].forEach((quiz, i)=>{
  const key = category + "-" + i;
  const saved = progress[key];

  const b = document.createElement('button');
  b.textContent = `Quiz ${i+1}`;

  if(saved){
    const color = getQuizColor(saved.score, saved.total);
    b.classList.add(color);
  }

  b.onclick = ()=>loadQuiz(i);

  if(i===0) b.classList.add('active');

  qs.appendChild(b);
});

  loadQuiz(0);

}

// ===== LOAD QUIZ =====
function loadQuiz(index){
if(mode === "code") return;
  currentQuizIndex = index;

  const key = currentCategory + "-" + index;

  // ensure array exists
  if(!userAnswers[index]) userAnswers[index] = [];

  // restore saved answers
// ALWAYS reset first (fixes "carry over answers")
userAnswers[index] = [];

// priority:
// 1. draft (unfinished quiz)
// 2. saved submitted progress (only if exists)
const draft = JSON.parse(localStorage.getItem(currentCategory + "-" + index + "-draft") || "null");

if(draft){
  userAnswers[index] = draft;
}

  // Highlight active quiz button
  document.querySelectorAll('#quizSelect button').forEach((b,i)=>b.classList.toggle('active', i===index));

  const quizArea = document.getElementById('quizArea');
  quizArea.innerHTML = '';

currentQuiz = randomizeQuiz(data[currentCategory][index]);

const quiz = currentQuiz;
  quiz.forEach((q, i)=>{
    const qDiv = document.createElement('div');
    qDiv.className = 'question';
    qDiv.dataset.qIndex = i;

    const qText = document.createElement('p');
    qText.textContent = `${i+1}. ${q.q}`;
    qDiv.appendChild(qText);

    const ansDiv = document.createElement('div');
    ansDiv.className = 'answers';

    if(q.type==='mc'){
      q.a.forEach((a,j)=>{
        const btn = document.createElement('button');
        btn.textContent = a;
        if(userAnswers[index][i]===j) btn.classList.add('selected');
        btn.onclick = ()=>selectAnswer(i,j,btn);
        ansDiv.appendChild(btn);
      });
    } else if(q.type==='mcm'){
      q.a.forEach((a,j)=>{
        const btn = document.createElement('button');
        btn.textContent = a;
        if(userAnswers[index][i] && userAnswers[index][i].includes(j)) btn.classList.add('selected');
        btn.onclick = ()=>toggleMCM(i,j,btn);
        ansDiv.appendChild(btn);
      });
    } else if(q.type==='fill'){
      const input = document.createElement('input');
      input.value = userAnswers[index][i] || '';
input.oninput = (e)=>{
  userAnswers[index][i]=e.target.value;
  saveDraft();
}
      ansDiv.appendChild(input);
    }

    qDiv.appendChild(ansDiv);
    quizArea.appendChild(qDiv);
  });

  document.getElementById('scoreBox').textContent = '';
  document.getElementById('submitBtn').disabled = false;
}

// ===== SELECT ANSWER (MC) =====
function selectAnswer(qIndex, ansIndex, btn){
  const quiz = data[currentCategory][currentQuizIndex];
  userAnswers[currentQuizIndex][qIndex] = ansIndex;

  // Remove previous selection
  const buttons = btn.parentElement.querySelectorAll('button');
  buttons.forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
saveDraft();
  updateQuizButtonCounter();
}

// ===== TOGGLE MULTIPLE CHOICE MULTIPLE (MCM) =====
function toggleMCM(qIndex, ansIndex, btn){
  userAnswers[currentQuizIndex][qIndex] = userAnswers[currentQuizIndex][qIndex] || [];
  const arr = userAnswers[currentQuizIndex][qIndex];
  const pos = arr.indexOf(ansIndex);
  if(pos>-1) arr.splice(pos,1);
  else arr.push(ansIndex);
  btn.classList.toggle('selected');
  updateQuizButtonCounter();
saveDraft();
}

// ===== UPDATE QUIZ BUTTON COUNTER =====
function updateQuizButtonCounter(){
  const btn = document.querySelectorAll('#quizSelect button')[currentQuizIndex];
  const answered = userAnswers[currentQuizIndex].filter(a=>a!==undefined && a!==null && (Array.isArray(a)?a.length>0:true)).length;
btn.textContent = `Quiz ${currentQuizIndex+1}`;}
// ===== SUBMIT QUIZ =====
function submitQuiz(){
const quiz = currentQuiz;
  let score = 0;

  quiz.forEach((q,i)=>{
    const ans = userAnswers[currentQuizIndex][i];
    const qDiv = document.querySelector(`.question[data-q-index="${i}"]`);
    qDiv.classList.remove('correct','wrong','partial');

    if(q.type==='mc' || q.type==='logic'){
      if(ans===q.c){
        score++;
        qDiv.classList.add('correct');
      } else {
        qDiv.classList.add('wrong');
      }
    } else if(q.type==='mcm'){
      const correct = q.c.sort().join(',');
      const given = (ans||[]).sort().join(',');
      if(given===correct){
        score++;
        qDiv.classList.add('correct');
      } else if(ans && ans.length>0){
        qDiv.classList.add('partial');
      } else {
        qDiv.classList.add('wrong');
      }
    } else if(q.type==='fill'){
      if(ans && ans.toString().trim().toLowerCase() === q.c.toString().trim().toLowerCase()){
        score++;
        qDiv.classList.add('correct');
      } else qDiv.classList.add('wrong');
    }
  });

  document.getElementById('scoreBox').textContent = `Score: ${score} / ${quiz.length}`;
  document.getElementById('submitBtn').disabled = true;

  // Enable retake
  if(!document.getElementById('retakeBtn')){
    const b = document.createElement('button');
    b.id = 'retakeBtn';
    b.textContent = 'Retake';
    b.onclick = retake;
    document.getElementById('controls').appendChild(b);
  } else document.getElementById('retakeBtn').disabled = false;

const key = currentCategory + "-" + currentQuizIndex;
updateQuizButtonColor(score, quiz.length);
progress[key] = {
  score,
  total: quiz.length,
  answers: [...userAnswers[currentQuizIndex]] // clone (important)
};
updateRank();
  saveProgress();
clearDraft();
}

// ===== RETAKE QUIZ =====
function retake(){
  const key = currentCategory + "-" + currentQuizIndex;

  // remove saved progress
  delete progress[key];
  saveProgress();

  // remove button color
  const btn = document.querySelectorAll('#quizSelect button')[currentQuizIndex];
  btn.classList.remove("red","yellow","green");

  userAnswers[currentQuizIndex] = [];

currentQuiz = [];
loadQuiz(currentQuizIndex);

  document.getElementById("scoreBox").textContent = "";
  document.getElementById("submitBtn").disabled = false;
clearDraft();
userAnswers[currentQuizIndex] = [];
  updateRank();
}
function buildQuizButtons(){
  const box = document.getElementById("quizSelect");
  const list = data[currentCategory];

  list.forEach((quiz, i)=>{
    const key = currentCategory + "-" + i;

    const btn = document.createElement("button");

    let saved = progress[key];
    let scoreText = saved ? `${saved.score}/${data[currentCategory][i].length}` : `0/${data[currentCategory][i].length}`;


    btn.textContent = `Quiz ${i+1} (${scoreText})`;

    btn.onclick = ()=>loadQuiz(i);

    box.appendChild(btn);
  });
}

function shuffleArray(arr){

  const copy=[...arr];

  for(let i=copy.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [copy[i],copy[j]]=[copy[j],copy[i]];

  }

  return copy;

}

function shuffleQuestion(q){

  if(q.type==="mc"){

    const answers=q.a.map((text,index)=>({
      text,
      correct:index===q.c
    }));

    const shuffled=shuffleArray(answers);

    return{
      ...q,
      a:shuffled.map(x=>x.text),
      c:shuffled.findIndex(x=>x.correct)
    };

  }

  if(q.type==="mcm"){

    const answers=q.a.map((text,index)=>({
      text,
      correct:q.c.includes(index)
    }));

    const shuffled=shuffleArray(answers);

    return{
      ...q,
      a:shuffled.map(x=>x.text),
      c:shuffled
        .map((x,index)=>x.correct?index:null)
        .filter(x=>x!==null)
    };

  }

  return {...q};

}

function randomizeQuiz(quiz){

  const questions=shuffleArray(quiz);

  return questions.map(q=>shuffleQuestion(q));

}
function getRankImg(rank){
  switch(rank){
    case "Beginner": 
      return "Images/Rank/rank_beginner.png";

    case "Starter": 
      return "Images/Rank/rank_starter.png";

    case "Learner": 
      return "Images/Rank/rank_learner.png";

    case "Intermediate": 
      return "Images/Rank/rank_intermediate.png";

    case "Advanced": 
      return "Images/Rank/rank_advanced.png";

    case "Expert": 
      return "Images/Rank/rank_expert.png";

    case "Professional": 
      return "Images/Rank/rank_expert.png";

    case "Master": 
      return "Images/Rank/rank_master.png";

    case "Grandmaster": 
      return "Images/Rank/rank_master.png";

    case "Elite": 
      return "Images/Rank/rank_legend.png";

    case "Legend": 
      return "Images/Rank/rank_legend.png";

    case "Mythic": 
      return "Images/Rank/rank_mythic.png";

    case "Arduino Master": 
      return "Images/Rank/rank_arduino_master.png";

    default: 
      return "Images/Rank/rank_beginner.png";
  }
}

function updateRank(){
  let score = Object.values(progress || {})
    .reduce((sum, p) => sum + (p.score || 0), 0);

  let rank = "Beginner";

  if(score >= 10) rank = "Starter";
  if(score >= 25) rank = "Learner";
  if(score >= 50) rank = "Intermediate";
  if(score >= 80) rank = "Advanced";
  if(score >= 120) rank = "Expert";
  if(score >= 170) rank = "Professional";
  if(score >= 220) rank = "Master";
  if(score >= 270) rank = "Grandmaster";
  if(score >= 320) rank = "Elite";
  if(score >= 360) rank = "Legend";
  if(score >= 390) rank = "Mythic";
  if(score >= 402) rank = "Arduino Master";

document.getElementById("rankBox").innerHTML = `
  <img src="${getRankImg(rank)}"
  style="width:16px;height:16px;
  vertical-align:middle;
  margin-right:6px;">

  <b>${rank}</b>

  <small style="opacity:0.7;margin-left:6px;">
    (${score} XP)
  </small>
`;

try{
  renderSidebarQuizzes();
}catch(err){
  console.error(err);
}
}
function saveProgress(){
  localStorage.setItem("progress", JSON.stringify(progress));
}

function loadProgress(){
  progress = JSON.parse(localStorage.getItem("progress")) || {};
}
function updateQuizButtonColor(score, total){
  const btn = document.querySelectorAll('#quizSelect button')[currentQuizIndex];

  btn.classList.remove("red","yellow","green");

  const color = getQuizColor(score, total);
  btn.classList.add(color);
}
function getQuizColor(score, total){
  if(score === 0) return "red";
  if(score === total) return "green";
  return "yellow";
}

function getTotalXP(){
  return Object.values(progress || {})
    .reduce((sum, p) => sum + (p.score || 0), 0);
}

function openCodeQuiz(u){

  mode = "code";

  document.getElementById("quizSelect").style.display = "none";
  document.getElementById("controls").style.display = "none";

  const area = document.getElementById("quizArea");
  area.innerHTML = "";

  const div = document.createElement("div");
  div.className = "codeArea";

  const title = u?.name || "Code Challenge";
  const desc = u?.desc || "";

  let html = `
    <h3>${title}</h3>
    <p>${desc}</p>

<div id="editorWrap">
  <div id="lineNums"></div>
  <div id="editorBox">
    <pre id="highlight"></pre>
    <textarea id="editor" placeholder="Write Arduino code here..."></textarea>
  </div>
</div>


    <button id="submitBtn" onclick="startCodeChallenge('${u.id}')">Submit Code</button>
    <br><br>
  `;

  // CUSTOM override
  if(u.id === "custom"){
    html = `
      <h3>${title}</h3>
      <p>${desc}</p>

      <input id="projTitle" placeholder="Project Title">
      <input id="projDesc" placeholder="What does it do?">

      <textarea id="editor" placeholder="Write Arduino code here..."></textarea>

      <button id="submitBtn" onclick="submitCode('${u.id}')">Submit Project</button>

      <br><br>
    `;
  }
  setTimeout(initEditor, 0);
  div.innerHTML = html;
  area.appendChild(div);
}

let editor, highlight, lines;

function initEditor(){
  editor = document.getElementById("editor");
  highlight = document.getElementById("highlight");
  lines = document.getElementById("lineNums");

  if(!editor) return;

  editor.addEventListener("input", () => {
    updateEditor();
  });

  editor.addEventListener("scroll", () => {
    highlight.scrollTop = editor.scrollTop;
    highlight.scrollLeft = editor.scrollLeft;
    lines.scrollTop = editor.scrollTop;
  });

  updateEditor();
}

function updateEditor(){
  updateLines();
  highlightCode();
}

function updateLines(){
  const count = editor.value.split("\n").length;
  lines.innerHTML = Array.from({length:count}, (_,i)=>i+1).join("<br>");
}

function highlightCode(){
  let code = editor.value
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/(\/\/.*)/g,'<span style="color:#22c55e">$1</span>')
    .replace(/\b(void|int|setup|loop|digitalWrite|delay|pinMode)\b/g,
      '<span style="color:#38bdf8">$1</span>')
    .replace(/\b(HIGH|LOW|OUTPUT|INPUT)\b/g,
      '<span style="color:#fbbf24">$1</span>')
    .replace(/\b(\d+)\b/g,
      '<span style="color:#a78bfa">$1</span>');

  highlight.innerHTML = code;
}

/*====================== Arduino Code Analyzer ======================*/

function analyzeCode(raw){

  const original=raw||"";

  const code=original
    .replace(/\r/g,"")
    .replace(/\t/g," ")
    .replace(/\/\/.*$/gm,"")
    .replace(/\/\*[\s\S]*?\*\//g,"")
    .replace(/\s+/g," ")
    .toLowerCase()
    .trim();

  const data={

    raw:original,
    code:code,

    lines:0,
    comments:0,

    setup:false,
    loop:false,

    libraries:[],
    variables:[],
    arrays:[],
    pins:[],

    functions:{},
    keywords:{},

    complexity:0

  };

  /*--------------- Lines ----------------*/

  data.lines=original
    .split("\n")
    .filter(v=>v.trim()!="")
    .length;

  /*--------------- Comments ----------------*/

  const comments=original.match(/\/\/.*|\/\*[\s\S]*?\*\//g);
  data.comments=comments?comments.length:0;

  /*--------------- setup / loop ----------------*/

  data.setup=/void\s+setup\s*\(/i.test(original);
  data.loop=/void\s+loop\s*\(/i.test(original);

  /*--------------- Libraries ----------------*/

  const libs=[
    "servo",
    "wire",
    "spi",
    "eeprom",
    "liquidcrystal",
    "liquidcrystal_i2c",
    "adafruit_ssd1306",
    "adafruit_gfx",
    "stepper",
    "irremote",
    "dht",
    "ezbutton"
  ];

  libs.forEach(lib=>{
    if(code.includes("#include") && code.includes(lib)){
      data.libraries.push(lib);
    }
  });

  /*--------------- Variables ----------------*/

  const vars=original.match(/\b(int|float|double|char|bool|byte|long|short|unsigned|String)\s+[A-Za-z_]\w*/g);

  if(vars){
    vars.forEach(v=>{
      data.variables.push(v);
    });
  }

  /*--------------- Arrays ----------------*/

  const arrays=original.match(/\b(int|float|char|bool|byte|long|String)\s+[A-Za-z_]\w*\s*\[/g);

  if(arrays){
    arrays.forEach(v=>{
      data.arrays.push(v);
    });
  }

  /*--------------- Functions ----------------*/

  const funcs=[

    "pinmode",
    "digitalwrite",
    "digitalread",
    "analogwrite",
    "analogread",

    "delay",
    "delaymicroseconds",

    "millis",
    "micros",

    "tone",
    "notone",

    "pulsein",

    "serial.begin",
    "serial.print",
    "serial.println",
    "serial.read",
    "serial.available",

    "attach",
    "write",
    "step",

    "display",
    "print",

    "map",
    "constrain"

  ];

  funcs.forEach(fn=>{

    const escaped=fn.replace(".","\\.");

    const count=(code.match(new RegExp(escaped+"\\s*\\(","g"))||[]).length;

    data.functions[fn]=count;

  });

  /*--------------- Keywords ----------------*/

  const keys=[
    "if",
    "else",
    "switch",
    "case",
    "for",
    "while",
    "do",
    "break",
    "continue",
    "return"
  ];

  keys.forEach(k=>{

    data.keywords[k]=(code.match(new RegExp("\\b"+k+"\\b","g"))||[]).length;

  });

  /*--------------- Detect Pins ----------------*/

  const pins=original.match(/\b(A[0-5]|[0-9]{1,2})\b/g);

  if(pins){

    data.pins=[...new Set(pins)];

  }

  /*--------------- Complexity ----------------*/

  data.complexity=

      data.lines
    + data.variables.length*2
    + data.arrays.length*3
    + data.comments
    + data.libraries.length*4
    + Object.values(data.functions).reduce((a,b)=>a+b,0)
    + Object.values(data.keywords).reduce((a,b)=>a+b,0);

  return data;

}

/*================ EXTRA DETECTION =================*/

function analogWriteCount(code){
  return count(code,"analogwrite");
}

function digitalReadCount(code){
  return count(code,"digitalread");
}

function serialCount(code){
  return count(code,"serial.");
}

function delayCount(code){
  return count(code,"delay");
}

function millisCount(code){
  return count(code,"millis");
}

function switchCount(code){
  return count(code,"switch");
}

function caseCount(code){
  return count(code,"case");
}

function returnCount(code){
  return count(code,"return");
}

function includeCount(code){
  return (code.match(/#include/gi)||[]).length;
}

function usesWire(code){
  return hasLibrary(code,"wire");
}

function usesSPI(code){
  return hasLibrary(code,"spi");
}

function usesServo(code){
  return hasLibrary(code,"servo");
}

function usesStepper(code){
  return hasLibrary(code,"stepper");
}

function usesLiquidCrystal(code){
  return hasLibrary(code,"liquidcrystal");
}

function usesEEPROM(code){
  return hasLibrary(code,"eeprom");
}

function usesPin(code,pin){

  return new RegExp("\\b"+pin+"\\b").test(code);

}

function usesPins(code,pins){

  return pins.every(p=>usesPin(code,p));

}

function countPins(code){

  const found=new Set();

  const matches=code.match(/\b([0-9]|1[0-3]|a[0-5])\b/gi)||[];

  matches.forEach(v=>found.add(v.toUpperCase()));

  return found.size;

}

function hasSetup(code){
  return has(code,"void setup(");
}

function hasLoop(code){
  return has(code,"void loop(");
}

function hasIf(code){
  return ifCount(code)>0;
}

function hasFor(code){
  return count(code,"for")>0;
}

function hasWhile(code){
  return count(code,"while")>0;
}

function hasSwitch(code){
  return switchCount(code)>0;
}

function usesInterrupt(code){
  return has(code,"attachinterrupt");
}

function usesMap(code){
  return hasFunction(code,"map");
}

function usesConstrain(code){
  return hasFunction(code,"constrain");
}

function usesRandom(code){
  return hasFunction(code,"random");
}

function usesTone(code){
  return hasFunction(code,"tone");
}

function usesNoTone(code){
  return hasFunction(code,"notone");
}

function scoreCode(raw,code){

  const c=complexity(raw,code);

  let score=0;

  score+=c.lines;
  score+=c.vars*3;
  score+=c.ifs*4;
  score+=c.loops*6;
  score+=c.pinModes*3;
  score+=c.digitalWrites*2;
  score+=c.analogReads*3;

  score+=analogWriteCount(code)*3;
  score+=digitalReadCount(code)*2;
  score+=serialCount(code)*3;
  score+=delayCount(code);
  score+=millisCount(code)*4;
  score+=switchCount(code)*5;
  score+=caseCount(code);
  score+=returnCount(code);

  if(usesWire(code))score+=15;
  if(usesSPI(code))score+=15;
  if(usesServo(code))score+=15;
  if(usesStepper(code))score+=20;
  if(usesLiquidCrystal(code))score+=20;
  if(usesEEPROM(code))score+=20;

  score+=countPins(code);

  return score;

}

function commonErrors(raw){

  const errors=[];

  if(!/void\s+setup\s*\(/i.test(raw))
    errors.push("Missing setup()");

  if(!/void\s+loop\s*\(/i.test(raw))
    errors.push("Missing loop()");

  if((raw.match(/\{/g)||[]).length!==(raw.match(/\}/g)||[]).length)
    errors.push("Unmatched braces");

  if(raw.includes("digitalWrite(")&&!raw.includes("pinMode("))
    errors.push("digitalWrite without pinMode");

  if(raw.includes("analogWrite(")&&!raw.includes("pinMode("))
    errors.push("analogWrite without pinMode");

  if(raw.includes("Serial.print")&&!raw.includes("Serial.begin"))
    errors.push("Serial.begin missing");

  return errors;

}

async function startCodeChallenge(id){

  const code = document.getElementById("editor").value;

  if(!code.trim()){
    alert("Write code first!");
    return;
  }

  // lock UI
  const btns = document.querySelectorAll("#quizArea button");
  btns.forEach(b => b.disabled = true);

  const consoleBox = document.getElementById("scoreBox");
  consoleBox.textContent = "⏳ Sending code to compiler...";

  activeCodeChallenge = id;
  challengeResult = null;

  try {
    const res = await fetch("https://arduino-guide-6.onrender.com/compile", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        code: code,
      })
    });

    const result = await res.json();

    challengeResult = result;

    consoleBox.textContent = "⏳ Compiling... wait for result";

    startChallengeTimer();

  } catch (err) {
    consoleBox.textContent = "❌ Server error";
    console.error(err);

    // unlock UI
    btns.forEach(b => b.disabled = false);
    activeCodeChallenge = null;
  }
}

function startChallengeTimer(){

  let timeLeft = 3;

  const consoleBox = document.getElementById("scoreBox");

  challengeTimer = setInterval(() => {

    timeLeft--;

    consoleBox.textContent = `⏳ Processing... ${timeLeft}s`;

    if(timeLeft <= 0){
      clearInterval(challengeTimer);
      showChallengeResult();
    }

  }, 1000);
}

function showChallengeResult(){

  const consoleBox = document.getElementById("scoreBox");

  const btns = document.querySelectorAll("#quizArea button");
  btns.forEach(b => b.disabled = false);

  if(!challengeResult){
    consoleBox.textContent = "❌ No compiler response";
    activeCodeChallenge = null;
    return;
  }

  const output = (challengeResult.output || "").toLowerCase();

  const passed =
    !output.includes("error") &&
    !output.includes("fail");

  if(passed){
    consoleBox.textContent = "✅ Challenge Passed!";

    // FIX: safe XP function
    addXPForChallenge(activeCodeChallenge);

    // update progress
    saveProgress();
    updateRank();

  } else {
    consoleBox.textContent = "❌ Challenge Failed!";
  }

  activeCodeChallenge = null;
}
function addXPForChallenge(id){

  const xpMap = {
  };

  const xp = xpMap[id] || 5;

  const key = "code-" + id;

  if(!progress[key]){
    progress[key] = { score: xp, total: xp };
  } else {
    progress[key].score += xp;
  }

  saveProgress();
  updateRank();
}
