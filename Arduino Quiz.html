<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arduino Quiz Hub</title>

<style>
:root{
  --bg:#f5faff;
  --panel:#ffffff;
  --accent:#00979d;
  --accent2:#00c853;
  --text:#0b1c2d;
}

/* ===== RESET ===== */
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:system-ui,Arial;
  background:var(--bg);
  color:var(--text);
}

/* ===== LAYOUT ===== */
#app{
  display:flex;
  height:100vh;
}

/* ===== SIDEBAR ===== */
#sidebar{
  width:220px;
  background:#050814;
  color:#aaa;
}

#sidebar h2{
  text-align:center;
  padding:12px;
  border-bottom:1px solid #222;
}

.cat{
  width:100%;
  padding:12px;
  background:none;
  border:none;
  color:#aaa;
  cursor:pointer;
  text-align:left;
}

.cat:hover,
.cat.active{
  background:#1a2cff;
  color:#fff;
}

/* ===== MAIN ===== */
#main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* ===== TOPBAR ===== */
#topbar{
  height:50px;
  background:#050814;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}

nav{
  display:flex;
  gap:10px;
}

nav a{
  color:#00cfff;
  text-decoration:none;
  padding:6px 10px;
}

nav a:hover{
  background:rgba(0,151,157,.2);
  border-radius:6px;
}

/* ===== CONTENT ===== */
#mainContent{
  padding:20px;
  overflow:auto;
}

/* ===== QUIZ ===== */
.question{
  background:var(--panel);
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.answers button{
  width:100%;
  margin:6px 0;
  padding:10px;

  border:none;
  border-radius:10px;

  background:linear-gradient(145deg,#eef6ff,#dceeff);
  cursor:pointer;
  font-weight:600;

  transition:.2s;
}

.answers button:hover{
  transform:translateY(-2px);
  background:#cfe9ff;
}

.answers button.selected{
  background:#00979d;
  color:white;
}

.answers button.correct{
  background:#00c853;
  color:white;
}

.answers button.wrong{
  background:#ff5252;
  color:white;
}

.correct{background:#d4f8d4;}
.wrong{background:#ffd6d6;}

#quizSelect{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:16px;
}

#quizSelect button{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  background:#e6f7ff;
  cursor:pointer;
  font-weight:600;
  transition:.2s;
}

#quizSelect button:hover{
  background:#ccefff;
  transform:translateY(-1px);
}

#quizSelect button.active{
  background:#00979d;
  color:white;
}

.question{
  background:white;
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.question.correct{background:#d4f8d4;}
.question.wrong{background:#ffd6d6;}
.question.partial{background:#fff3cd;}

.question input,
.question textarea{
  margin-top:6px;
  padding:6px;
  width:100%;
  border-radius:6px;
  border:1px solid #ccc;
}

.answers label{
  display:block;
  margin:4px 0;
  cursor:pointer;
}

/* ===== BUTTONS ===== */
#controls{
  margin-top:20px;
}

#controls button{
  padding:10px 16px;
  border:none;
  background:#1a2cff;
  color:white;
  cursor:pointer;
  margin-right:10px;
}

#controls button:disabled{
  opacity:0.5;
  cursor:not-allowed;
}

#rankBox{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:bold;
}
#quizSelect button.red{
  background:#ff5252;
  color:white;
}

#quizSelect button.yellow{
  background:#ffd54f;
  color:black;
}

#quizSelect button.green{
  background:#00c853;
  color:white;
}
::-webkit-scrollbar{display:none}

/* ===== MOBILE ===== */
@media(max-width:900px){

  #app{
    flex-direction:column;
    height:auto;
  }

  /* SIDEBAR → becomes TOP NAV */
  #sidebar{
    width:100%;
    display:flex;
    flex-direction:column;
  }

  #sidebar h2{
    font-size:16px;
    padding:10px;
  }

  .sideSection{
    text-align:center;
    padding:6px;
    border-bottom:1px solid #222;
  }

  .cat{
    flex:1;
    text-align:center;
    font-size:14px;
    padding:10px 6px;
  }

  /* category buttons row */
  #sidebar{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
  }

  #sidebar h2,
  .sideSection{
    grid-column:1 / -1;
  }

  /* MAIN AREA */
  #mainContent{
    padding:12px;
  }

  /* QUIZ SELECT BUTTONS */
  #quizSelect{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  #quizSelect button{
    width:100%;
    padding:10px;
    font-size:14px;
  }

  /* QUESTIONS */
  .question{
    padding:10px;
  }

  .question p{
    font-size:15px;
  }

  /* ANSWERS → BIG TOUCH BUTTONS */
  .answers button{
    padding:14px;
    font-size:15px;
    border-radius:12px;
  }

  input{
    font-size:16px;
    padding:10px;
  }

  /* CONTROLS */
  #controls{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  #controls button{
    width:100%;
    padding:14px;
    font-size:16px;
    border-radius:10px;
  }

  /* TOPBAR */
  #topbar{
    flex-direction:column;
    height:auto;
    gap:6px;
    padding:10px;
    text-align:center;
  }

  nav{
    justify-content:center;
    flex-wrap:wrap;
  }

  /* SCORE */
  #scoreBox{
    text-align:center;
    margin-top:10px;
    font-size:18px;
  }
}
/* HEADER TITLE */
.headerTitle{
  font-weight:bold;
  font-size:18px;
}}
#codeUnlocks{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.codeBtn{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#222;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.codeBtn.locked{
  background:#555;
  cursor:not-allowed;
  opacity:0.6;
}

.codeArea textarea{
  width:100%;
  height:150px;
  margin-top:10px;
  font-family:monospace;
}

.codeArea input{
  width:100%;
  margin-top:6px;
}
</style>
</head>

</div>

let currentCategory = 'pins';

let activeCodeChallenge = null;
let challengeTimer = null;
let challengeResult = null;
function getDraftKey(){
  return currentCategory + "-" + currentQuizIndex + "-draft";
}

function saveDraft(){
  localStorage.setItem(getDraftKey(), JSON.stringify(userAnswers[currentQuizIndex] || []));
}

function loadDraft(){
  const key = getDraftKey();
  return JSON.parse(localStorage.getItem(key) || "[]");
}

function clearDraft(){
  localStorage.removeItem(getDraftKey());
}

// ===== LOAD CATEGORY =====
function loadCategory(category, btn){
mode = "quiz";
document.getElementById("quizSelect").style.display = "flex";
document.getElementById("controls").style.display = "block";
document.getElementById("quizArea").innerHTML = "";
  currentCategory = category;
  currentQuizIndex = 0;
  userAnswers = Array.from({ length: data[category].length }, () => []);
  totalQuestions = data[category].length;

  // Highlight active button
  document.querySelectorAll('#sidebar .cat').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');

  // Set title
  document.getElementById('title').textContent = category.charAt(0).toUpperCase() + category.slice(1);

  // Render quiz select buttons
  const qs = document.getElementById('quizSelect');
  qs.innerHTML = '';
data[category].forEach((quiz, i)=>{
  const key = category + "-" + i;
  const saved = progress[key];

  const b = document.createElement('button');
  b.textContent = `Quiz ${i+1}`;

  if(saved){
    const color = getQuizColor(saved.score, saved.total);
    b.classList.add(color);
  }

  b.onclick = ()=>loadQuiz(i);

  if(i===0) b.classList.add('active');

  qs.appendChild(b);
});

  loadQuiz(0);
}

// ===== LOAD QUIZ =====
function loadQuiz(index){
if(mode === "code") return;
  currentQuizIndex = index;

  const key = currentCategory + "-" + index;

  // ensure array exists
  if(!userAnswers[index]) userAnswers[index] = [];

  // restore saved answers
// ALWAYS reset first (fixes "carry over answers")
userAnswers[index] = [];

// priority:
// 1. draft (unfinished quiz)
// 2. saved submitted progress (only if exists)
const draft = JSON.parse(localStorage.getItem(currentCategory + "-" + index + "-draft") || "null");

if(draft){
  userAnswers[index] = draft;
}

  // Highlight active quiz button
  document.querySelectorAll('#quizSelect button').forEach((b,i)=>b.classList.toggle('active', i===index));

  const quizArea = document.getElementById('quizArea');
  quizArea.innerHTML = '';

  const quiz = data[currentCategory][index];
  quiz.forEach((q, i)=>{
    const qDiv = document.createElement('div');
    qDiv.className = 'question';
    qDiv.dataset.qIndex = i;

    const qText = document.createElement('p');
    qText.textContent = `${i+1}. ${q.q}`;
    qDiv.appendChild(qText);

    const ansDiv = document.createElement('div');
    ansDiv.className = 'answers';

    if(q.type==='mc'){
      q.a.forEach((a,j)=>{
        const btn = document.createElement('button');
        btn.textContent = a;
        if(userAnswers[index][i]===j) btn.classList.add('selected');
        btn.onclick = ()=>selectAnswer(i,j,btn);
        ansDiv.appendChild(btn);
      });
    } else if(q.type==='mcm'){
      q.a.forEach((a,j)=>{
        const btn = document.createElement('button');
        btn.textContent = a;
        if(userAnswers[index][i] && userAnswers[index][i].includes(j)) btn.classList.add('selected');
        btn.onclick = ()=>toggleMCM(i,j,btn);
        ansDiv.appendChild(btn);
      });
    } else if(q.type==='fill'){
      const input = document.createElement('input');
      input.value = userAnswers[index][i] || '';
input.oninput = (e)=>{
  userAnswers[index][i]=e.target.value;
  saveDraft();
}
      ansDiv.appendChild(input);
    }

    qDiv.appendChild(ansDiv);
    quizArea.appendChild(qDiv);
  });

  document.getElementById('scoreBox').textContent = '';
  document.getElementById('submitBtn').disabled = false;
}

// ===== SELECT ANSWER (MC) =====
function selectAnswer(qIndex, ansIndex, btn){
  const quiz = data[currentCategory][currentQuizIndex];
  userAnswers[currentQuizIndex][qIndex] = ansIndex;

  // Remove previous selection
  const buttons = btn.parentElement.querySelectorAll('button');
  buttons.forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
saveDraft();
  updateQuizButtonCounter();
}

// ===== TOGGLE MULTIPLE CHOICE MULTIPLE (MCM) =====
function toggleMCM(qIndex, ansIndex, btn){
  userAnswers[currentQuizIndex][qIndex] = userAnswers[currentQuizIndex][qIndex] || [];
  const arr = userAnswers[currentQuizIndex][qIndex];
  const pos = arr.indexOf(ansIndex);
  if(pos>-1) arr.splice(pos,1);
  else arr.push(ansIndex);
  btn.classList.toggle('selected');
  updateQuizButtonCounter();
saveDraft();
}

// ===== UPDATE QUIZ BUTTON COUNTER =====
function updateQuizButtonCounter(){
  const btn = document.querySelectorAll('#quizSelect button')[currentQuizIndex];
  const answered = userAnswers[currentQuizIndex].filter(a=>a!==undefined && a!==null && (Array.isArray(a)?a.length>0:true)).length;
btn.textContent = `Quiz ${currentQuizIndex+1}`;}
// ===== SUBMIT QUIZ =====
function submitQuiz(){
  const quiz = data[currentCategory][currentQuizIndex];
  let score = 0;

  quiz.forEach((q,i)=>{
    const ans = userAnswers[currentQuizIndex][i];
    const qDiv = document.querySelector(`.question[data-q-index="${i}"]`);
    qDiv.classList.remove('correct','wrong','partial');

    if(q.type==='mc' || q.type==='logic'){
      if(ans===q.c){
        score++;
        qDiv.classList.add('correct');
      } else {
        qDiv.classList.add('wrong');
      }
    } else if(q.type==='mcm'){
      const correct = q.c.sort().join(',');
      const given = (ans||[]).sort().join(',');
      if(given===correct){
        score++;
        qDiv.classList.add('correct');
      } else if(ans && ans.length>0){
        qDiv.classList.add('partial');
      } else {
        qDiv.classList.add('wrong');
      }
    } else if(q.type==='fill'){
      if(ans && ans.toString().trim().toLowerCase() === q.c.toString().trim().toLowerCase()){
        score++;
        qDiv.classList.add('correct');
      } else qDiv.classList.add('wrong');
    }
  });

  document.getElementById('scoreBox').textContent = `Score: ${score} / ${quiz.length}`;
  document.getElementById('submitBtn').disabled = true;

  // Enable retake
  if(!document.getElementById('retakeBtn')){
    const b = document.createElement('button');
    b.id = 'retakeBtn';
    b.textContent = 'Retake';
    b.onclick = retake;
    document.getElementById('controls').appendChild(b);
  } else document.getElementById('retakeBtn').disabled = false;

const key = currentCategory + "-" + currentQuizIndex;
updateQuizButtonColor(score, quiz.length);
progress[key] = {
  score,
  total: quiz.length,
  answers: [...userAnswers[currentQuizIndex]] // clone (important)
};
updateRank();
  saveProgress();
clearDraft();
}

// ===== RETAKE QUIZ =====
function retake(){
  const key = currentCategory + "-" + currentQuizIndex;

  // remove saved progress
  delete progress[key];
  saveProgress();

  // remove button color
  const btn = document.querySelectorAll('#quizSelect button')[currentQuizIndex];
  btn.classList.remove("red","yellow","green");

  userAnswers[currentQuizIndex] = [];

  loadQuiz(currentQuizIndex);

  document.getElementById("scoreBox").textContent = "";
  document.getElementById("submitBtn").disabled = false;
clearDraft();
userAnswers[currentQuizIndex] = [];
  updateRank();
}
function buildQuizButtons(){
  const box = document.getElementById("quizSelect");
  const list = data[currentCategory];

  list.forEach((quiz, i)=>{
    const key = currentCategory + "-" + i;

    const btn = document.createElement("button");

    let saved = progress[key];
    let scoreText = saved ? `${saved.score}/${quiz.length}` : `0/${quiz.length}`;

    btn.textContent = `Quiz ${i+1} (${scoreText})`;

    btn.onclick = ()=>loadQuiz(i);

    box.appendChild(btn);
  });
}
function getRankImg(rank){
  switch(rank){
    case "Beginner": return "Images/rank_beginner.png";
    case "Starter": return "Images/rank_starter.png";
    case "Learner": return "Images/rank_learner.png";
    case "Intermediate": return "Images/rank_intermediate.png";
    case "Advanced": return "Images/rank_advanced.png";
    case "Expert": return "Images/rank_expert.png";
    case "Master": return "Images/rank_master.png";
    case "Legend": return "Images/rank_legend.png";
    default: return "Images/rank_beginner.png";
  }
}

function updateRank(){
  let score = Object.values(progress || {})
    .reduce((sum, p) => sum + (p.score || 0), 0);

  let rank = "Beginner";

  if(score >= 10) rank = "Starter";
  if(score >= 23) rank = "Learner";
  if(score >= 50) rank = "Intermediate";
  if(score >= 80) rank = "Advanced";
  if(score >= 120) rank = "Expert";
  if(score >= 180) rank = "Master";
  if(score >= 230) rank = "Legend";

  document.getElementById("rankBox").innerHTML = `
    <img src="${getRankImg(rank)}" style="width:16px;height:16px;vertical-align:middle;margin-right:6px;">
    <b>${rank}</b>
    <small style="opacity:0.7;margin-left:6px;">(${score} XP)</small>
  `;
renderSidebarQuizzes();
}
function saveProgress(){
  localStorage.setItem("progress", JSON.stringify(progress));
}

function loadProgress(){
  progress = JSON.parse(localStorage.getItem("progress")) || {};
}
function updateQuizButtonColor(score, total){
  const btn = document.querySelectorAll('#quizSelect button')[currentQuizIndex];

  btn.classList.remove("red","yellow","green");

  const color = getQuizColor(score, total);
  btn.classList.add(color);
}
function getQuizColor(score, total){
  if(score === 0) return "red";
  if(score === total) return "green";
  return "yellow";
}

function getTotalXP(){
  return Object.values(progress || {})
    .reduce((sum, p) => sum + (p.score || 0), 0);
}

function openCodeQuiz(u){

  mode = "code";

  document.getElementById("quizSelect").style.display = "none";
  document.getElementById("controls").style.display = "none";

  const area = document.getElementById("quizArea");
  area.innerHTML = "";

  div.className = "codeArea";

  const title = u?.name || "Code Challenge";

  let html = `
    <h3>${title}</h3>
    <p>${desc}</p>

    <button onclick="startCodeChallenge('${u.id}')">Submit Code</button>
    <br><br>
  `;

  if(u.id === "custom"){
    html = `
      <h3>${title}</h3>
      <p>${desc}</p>

      <input id="projTitle" placeholder="Project Title">
      <input id="projDesc" placeholder="What does it do?">

      <textarea id="codeInput" placeholder="Write Arduino code here..."></textarea>

  mode = "quiz";

  document.getElementById("quizSelect").style.display = "flex";

function renderSidebarQuizzes(){

  const box = document.getElementById("sidebarQuizzes");
  box.innerHTML = "";

  /* ================= CODE CHALLENGES (NEW PART) ================= */
  const codeChallenges = [

}

function submitCode(id){
  const code = document.getElementById("codeInput").value.toLowerCase();

  let passed = false;

  if(id === "blink"){
    if(code.includes("pinmode") &&
       code.includes("digitalwrite") &&
       code.includes("delay")){
      passed = true;
    }
  }

  if(id === "buzzer"){
    if(code.includes("tone") || code.includes("digitalwrite")){
      passed = true;
    }
  }

  if(id === "multiled"){
    const writes = (code.match(/digitalwrite/g) || []).length;
    if(code.includes("pinmode") && writes >= 2){
      passed = true;
    }
  }

  if(id === "custom"){
    const title = document.getElementById("projTitle").value;
    const desc = document.getElementById("projDesc").value;

    if(title && desc && code.length > 30){
      passed = true;
    }
  }

  if(passed){
    alert("✅ Passed!");
  } else {
    alert("❌ Try again!");
  }
}

async function startCodeChallenge(id){

  const code = document.getElementById("codeInput").value;

  if(!code.trim()){
    alert("Write code first!");
    return;
  }

  // lock UI
  const btns = document.querySelectorAll("#quizArea button");
  btns.forEach(b => b.disabled = true);

  const consoleBox = document.getElementById("scoreBox");
  consoleBox.textContent = "⏳ Sending code to compiler...";

  activeCodeChallenge = id;
  challengeResult = null;

  try {
    const res = await fetch("https://arduino-guide-6.onrender.com/compile", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        code: code,
        board: board.value
      })
    });

    const result = await res.json();

    challengeResult = result;

    consoleBox.textContent = "⏳ Compiling... wait for result";

    startChallengeTimer();

  } catch (err) {
    consoleBox.textContent = "❌ Server error";
    console.error(err);

    // unlock UI
    btns.forEach(b => b.disabled = false);
    activeCodeChallenge = null;
  }
}

function startChallengeTimer(){

  let timeLeft = 10; // (IMPORTANT: reduce from 120 for real testing)

  const consoleBox = document.getElementById("scoreBox");

  challengeTimer = setInterval(() => {

    timeLeft--;

    consoleBox.textContent = `⏳ Processing... ${timeLeft}s`;

    if(timeLeft <= 0){
      clearInterval(challengeTimer);
      showChallengeResult();
    }

  }, 1000);
}

function showChallengeResult(){

  const consoleBox = document.getElementById("scoreBox");

  const btns = document.querySelectorAll("#quizArea button");
  btns.forEach(b => b.disabled = false);

  if(!challengeResult){
    consoleBox.textContent = "❌ No compiler response";
    activeCodeChallenge = null;
    return;
  }

  const output = (challengeResult.output || "").toLowerCase();

  const passed =
    !output.includes("error") &&
    !output.includes("fail");

  if(passed){
    consoleBox.textContent = "✅ Challenge Passed!";

    // FIX: safe XP function
    addXPForChallenge(activeCodeChallenge);

    // update progress
    saveProgress();
    updateRank();

  } else {
    consoleBox.textContent = "❌ Challenge Failed!";
  }

  activeCodeChallenge = null;
}
function addXPForChallenge(id){

  const xpMap = {
  };

  const xp = xpMap[id] || 5;

  const key = "code-" + id;

  if(!progress[key]){
    progress[key] = { score: xp, total: xp };
  } else {
    progress[key].score += xp;
  }

  saveProgress();
  updateRank();
}


window.onload = () => {
  loadProgress();
  updateRank();
  loadCategory(currentCategory, document.querySelector('.cat.active'));
};
