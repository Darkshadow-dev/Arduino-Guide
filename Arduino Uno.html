<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Arduino Uno Simulator</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    background:#808080;
    font-family:monospace;
}

#backButton{
    position:fixed;
    top:10px;
    left:10px;
    z-index:100;
    background:#444;
    color:white;
    border:1px solid #222;
    padding:7px 12px;
    cursor:pointer;
}

#workspace{
    position:absolute;
    width:90vw;
    height:90vh;
    left:5vw;
    top:5vh;
    background:#e8e8e8;
    border:1px solid #333;
    overflow:hidden;
}

#simulator{
    position:absolute;
    inset:0;
}

/* ============================================================
   ARDUINO UNO
   ============================================================ */

#arduinoUno{
    position:absolute;
    width:420px;
    height:270px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:#008c8c;
    border:3px solid #222;
    border-radius:18px;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
}

/* ============================================================
   USB
   ============================================================ */

#usb{
    position:absolute;
    left:-34px;
    top:35px;
    width:38px;
    height:65px;
    background:#b8b8b8;
    border:2px solid #333;
    border-radius:4px 0 0 4px;
}

/* ============================================================
   POWER
   ============================================================ */

#powerJack{
    position:absolute;
    right:-30px;
    top:35px;
    width:32px;
    height:55px;
    background:#222;
    border:2px solid #111;
    border-radius:0 5px 5px 0;
}

/* ============================================================
   BOARD LABEL
   ============================================================ */

#boardLabel{
    position:absolute;
    left:25px;
    top:20px;
    color:white;
    font-family:Arial,sans-serif;
    font-size:22px;
    font-weight:bold;
}

/* ============================================================
   BUILT-IN LED
   ============================================================ */

#builtinLed{
    position:absolute;
    right:30px;
    top:22px;
    width:16px;
    height:16px;
    border-radius:50%;
    background:#555;
    border:2px solid #222;
}

#builtinLed.on{
    background:#ff3030;
    box-shadow:
        0 0 8px #ff3030,
        0 0 18px #ff3030;
}

/* ============================================================
   DIGITAL PINS
   ============================================================ */

#digitalPins{
    position:absolute;
    left:25px;
    right:25px;
    bottom:45px;
    height:45px;
    display:flex;
    gap:5px;
}

.digitalPin{
    flex:1;
    min-width:0;
    height:45px;
    background:#222;
    border:1px solid #111;
    border-radius:3px;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    cursor:default;
}

.digitalPin.high{
    background:#d33;
    box-shadow:0 0 7px rgba(255,0,0,.7);
}

/* ============================================================
   ANALOG PINS
   ============================================================ */

#analogPins{
    position:absolute;
    left:25px;
    right:25px;
    bottom:0;
    height:30px;
    display:flex;
    gap:5px;
}

.analogPin{
    flex:1;
    background:#333;
    color:white;
    border:1px solid #111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
}

/* ============================================================
   STATUS
   ============================================================ */

#simulatorStatus{
    position:absolute;
    left:15px;
    top:15px;
    min-width:180px;
    padding:8px 10px;
    background:rgba(0,0,0,.75);
    color:#fff;
    border:1px solid #333;
    font-size:12px;
    z-index:20;
}

#simulatorStatus.error{
    color:#ff7070;
}

#simulatorStatus.ready{
    color:#70ff70;
}

/* ============================================================
   SERIAL / DEBUG
   ============================================================ */

#simulatorConsole{
    position:absolute;
    right:15px;
    bottom:15px;
    width:240px;
    height:110px;
    padding:8px;
    overflow:auto;
    background:#111;
    color:#0f0;
    border:1px solid #333;
    font-size:11px;
    white-space:pre-wrap;
    z-index:20;
}
</style>
</head>

<body>

<button id="backButton" onclick="history.back()">← Back</button>

<div id="workspace">

    <div id="simulator">

        <div id="simulatorStatus">
            Loading simulator...
        </div>

        <div id="simulatorConsole"></div>

        <div id="arduinoUno">

            <div id="usb"></div>
            <div id="powerJack"></div>

            <div id="boardLabel">
                Arduino UNO
            </div>

            <div id="builtinLed"></div>

            <div id="digitalPins">

                <div class="digitalPin" data-pin="0">0</div>
                <div class="digitalPin" data-pin="1">1</div>
                <div class="digitalPin" data-pin="2">2</div>
                <div class="digitalPin" data-pin="3">3</div>
                <div class="digitalPin" data-pin="4">4</div>
                <div class="digitalPin" data-pin="5">5</div>
                <div class="digitalPin" data-pin="6">6</div>
                <div class="digitalPin" data-pin="7">7</div>
                <div class="digitalPin" data-pin="8">8</div>
                <div class="digitalPin" data-pin="9">9</div>
                <div class="digitalPin" data-pin="10">10</div>
                <div class="digitalPin" data-pin="11">11</div>
                <div class="digitalPin" data-pin="12">12</div>
                <div class="digitalPin" data-pin="13">13</div>

            </div>

            <div id="analogPins">

                <div class="analogPin">A0</div>
                <div class="analogPin">A1</div>
                <div class="analogPin">A2</div>
                <div class="analogPin">A3</div>
                <div class="analogPin">A4</div>
                <div class="analogPin">A5</div>

            </div>

        </div>

    </div>

</div>

<script>/*
============================================================
GUIDELINES ARDUINO UNO SIMULATOR
============================================================
*/

const simulator =
    document.getElementById("simulator");

const statusBox =
    document.getElementById("simulatorStatus");

const consoleBox =
    document.getElementById("simulatorConsole");


/*
============================================================
SERVER
============================================================
*/

const GSE_SERVER =
    "https://arduino-guide-6.onrender.com";


/*
============================================================
GSE
============================================================
*/

let gse = null;

const token =
    new URLSearchParams(
        window.location.search
    ).get("gse");


/*
============================================================
SIMULATOR STATE
============================================================
*/

const simulatorState = {
    pins:{},
    analogPins:{},
    serial:[],
    time:0
};


/*
============================================================
STATUS
============================================================
*/

function setStatus(
    text,
    type=""
){

    if(!statusBox){
        return;
    }

    statusBox.textContent =
        text;

    statusBox.className =
        type;

}


/*
============================================================
CONSOLE
============================================================
*/

function simulatorLog(
    text
){

    if(!consoleBox){
        return;
    }

    consoleBox.textContent +=
        text + "\n";

    consoleBox.scrollTop =
        consoleBox.scrollHeight;

}


/*
============================================================
LOAD GSE
============================================================
*/

async function loadGSE(){

    if(!token){

        throw new Error(
            "No GSE token was provided."
        );

    }

    setStatus(
        "Loading GSE..."
    );

    const response =
        await fetch(
            GSE_SERVER +
            "/gse/" +
            encodeURIComponent(token)
        );

    if(!response.ok){

        throw new Error(
            "GSE server returned HTTP " +
            response.status
        );

    }

    const data =
        await response.json();

    if(
        !data ||
        !data.success ||
        !data.executable
    ){

        throw new Error(
            data.error ||
            "Invalid GSE response."
        );

    }

    gse =
        data.executable;

    validateGSE();

    simulatorLog(
        "GSE loaded."
    );

}


/*
============================================================
VALIDATE GSE
============================================================
*/

function validateGSE(){

    if(!gse){

        throw new Error(
            "GSE executable is missing."
        );

    }

    if(
        gse.format !== "GSE"
    ){

        throw new Error(
            "Invalid GSE format."
        );

    }

    if(
        typeof gse.version !== "number"
    ){

        throw new Error(
            "Invalid GSE version."
        );

    }

    if(
        !gse.program
    ){

        throw new Error(
            "GSE program is missing."
        );

    }

    if(
        !Array.isArray(
            gse.program.setup
        )
    ){

        throw new Error(
            "GSE setup is invalid."
        );

    }

    if(
        !Array.isArray(
            gse.program.loop
        )
    ){

        throw new Error(
            "GSE loop is invalid."
        );

    }

}


/*
============================================================
PIN HELPERS
============================================================
*/

function getPin(
    pin
){

    if(
        !simulatorState.pins[pin]
    ){

        simulatorState.pins[pin] = {
            mode:null,
            value:0,
            pwm:0
        };

    }

    return simulatorState.pins[pin];

}


/*
============================================================
PIN MODE
============================================================
*/

function executePinMode(
    instruction
){

    const pin =
        getPin(
            instruction.pin
        );

    pin.mode =
        instruction.mode;

}


/*
============================================================
DIGITAL WRITE
============================================================
*/

function executeDigitalWrite(
    instruction
){

    const pin =
        getPin(
            instruction.pin
        );

    pin.value =
        instruction.value ? 1 : 0;

    updateDigitalPin(
        instruction.pin
    );

}


/*
============================================================
ANALOG WRITE / PWM
============================================================
*/

function executeAnalogWrite(
    instruction
){

    const pin =
        getPin(
            instruction.pin
        );

    let value =
        Number(
            instruction.value
        );

    if(
        Number.isNaN(value)
    ){

        value = 0;

    }

    value =
        Math.max(
            0,
            Math.min(
                255,
                value
            )
        );

    pin.pwm =
        value;

    pin.value =
        value > 0 ? 1 : 0;

    updateAnalogPin(
        instruction.pin
    );

}


/*
============================================================
DIGITAL PIN DISPLAY
============================================================
*/

function updateDigitalPin(
    pinNumber
){

    const element =
        document.querySelector(
            '.digitalPin[data-pin="' +
            pinNumber +
            '"]'
        );

    if(!element){
        return;
    }

    const pin =
        getPin(
            pinNumber
        );

    if(pin.value){

        element.classList.add(
            "high"
        );

    }
    else{

        element.classList.remove(
            "high"
        );

    }

    if(
        Number(pinNumber) === 13
    ){

        updateBuiltinLED(
            pin.value
        );

    }

}


/*
============================================================
BUILT-IN LED
============================================================
*/

function updateBuiltinLED(
    value
){

    const led =
        document.getElementById(
            "builtinLed"
        );

    if(!led){
        return;
    }

    if(value){

        led.classList.add(
            "on"
        );

    }
    else{

        led.classList.remove(
            "on"
        );

    }

}


/*
============================================================
ANALOG / PWM DISPLAY
============================================================
*/

function updateAnalogPin(
    pinNumber
){

    const element =
        document.querySelector(
            '.digitalPin[data-pin="' +
            pinNumber +
            '"]'
        );

    if(!element){
        return;
    }

    const pin =
        getPin(
            pinNumber
        );

    const pwm =
        pin.pwm;

    element.style.opacity =
        pwm === 0
            ? "0.35"
            : String(
                0.35 +
                (pwm / 255) * 0.65
            );

    element.title =
        "PWM: " +
        pwm +
        "/255";

    if(
        Number(pinNumber) === 13
    ){

        updateBuiltinLEDPWM(
            pwm
        );

    }

}


/*
============================================================
BUILT-IN LED PWM
============================================================
*/

function updateBuiltinLEDPWM(
    value
){

    const led =
        document.getElementById(
            "builtinLed"
        );

    if(!led){
        return;
    }

    if(value <= 0){

        led.classList.remove(
            "on"
        );

        led.style.opacity =
            "0.35";

        return;

    }

    led.classList.add(
        "on"
    );

    led.style.opacity =
        String(
            0.25 +
            (value / 255) * 0.75
        );

}


/*
============================================================
DELAY
============================================================
*/

function executeDelay(
    milliseconds
){

    return new Promise(
        resolve => {

            setTimeout(
                resolve,
                Math.max(
                    0,
                    Number(milliseconds) || 0
                )
            );

        }
    );

}


/*
============================================================
EXECUTE INSTRUCTION
============================================================
*/

async function executeInstruction(
    instruction
){

    if(!instruction){
        return;
    }

    switch(
        instruction.op
    ){

        case "PIN_MODE":

            executePinMode(
                instruction
            );

            break;


        case "DIGITAL_WRITE":

            executeDigitalWrite(
                instruction
            );

            break;


        case "ANALOG_WRITE":

            executeAnalogWrite(
                instruction
            );

            break;


        case "DELAY":

            await executeDelay(
                instruction.ms
            );

            simulatorState.time +=
                Number(
                    instruction.ms
                ) || 0;

            break;


        default:

            throw new Error(
                "Unsupported GSE operation: " +
                instruction.op
            );

    }

}


/*
============================================================
EXECUTE PROGRAM
============================================================
*/

async function executeProgram(
    instructions
){

    for(
        const instruction
        of instructions
    ){

        await executeInstruction(
            instruction
        );

    }

}


/*
============================================================
SETUP
============================================================
*/

async function executeSetup(){

    simulatorLog(
        "Running setup..."
    );

    await executeProgram(
        gse.program.setup
    );

    simulatorLog(
        "Setup complete."
    );

}


/*
============================================================
LOOP
============================================================
*/

async function executeLoop(){

    while(true){

        await executeProgram(
            gse.program.loop
        );

    }

}


/*
============================================================
START
============================================================
*/

async function startSimulator(){

    try{

        if(!token){

            setStatus(
                "No GSE token.",
                "error"
            );

            return;

        }

        await loadGSE();

        setStatus(
            "GSE loaded. Starting...",
            "ready"
        );

        await executeSetup();

        setStatus(
            "Simulator running.",
            "ready"
        );

        await executeLoop();

    }
    catch(error){

        console.error(
            "Simulator error:",
            error
        );

        setStatus(
            "Simulator error: " +
            error.message,
            "error"
        );

        simulatorLog(
            "ERROR: " +
            error.message
        );

    }

}


/*
============================================================
START
============================================================
*/

startSimulator();
</script>

</body>
</html>
