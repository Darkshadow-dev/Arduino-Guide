```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Arduino Uno Simulator</title>
<style>
*{
    box-sizing:border-box;
}
html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}
body{
    background:#808080;
    font-family:monospace;
}
#backButton{
    position:fixed;
    top:10px;
    left:10px;
    z-index:10;
    background:#444;
    color:white;
    border:1px solid #222;
    padding:7px 12px;
    cursor:pointer;
}
#workspace{
    position:absolute;
    width:90vw;
    height:90vh;
    left:5vw;
    top:5vh;
    background:white;
    border:1px solid #333;
    overflow:hidden;
}
#simulator{
    position:absolute;
    inset:0;
}
</style>
</head>
<body>

<button id="backButton" onclick="history.back()">← Back</button>

<div id="workspace">
    <div id="simulator"></div>
</div>

<script src="js/ArduinoUno.js"></script>

</body>
</html>
```
