
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arduino Code Blocks</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #f5faff;
    --panel: #ffffff;
    --sidebar: #eaf3fc;
    --border: #c9d9e9;
    --accent: #00979d;
    --text: #172b45;
    --muted: #71869c;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

body {
    display: flex;
    flex-direction: column;
}

/* HEADER */

.header {
    height: 43px;
    min-height: 43px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    background: white;
    border-bottom: 1px solid var(--border);
}

.header h2 {
    font-size: 15px;
    margin: 0;
}

.header small {
    font-size: 10px;
    color: var(--muted);
}

/* MAIN LAYOUT */

.workspace {
    display: grid;
    grid-template-columns: 25% 75%;
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

/* LEFT NAVIGATION */

.navigation {
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    padding: 9px 7px;
    overflow-y: auto;
}

.nav-heading {
    font-size: 10px;
    font-weight: bold;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .6px;
    padding: 5px 6px 9px;
}

.nav-category {
    margin-bottom: 7px;
}

.category-toggle {
    width: 100%;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    padding: 9px 7px;
    text-align: left;
    color: var(--text);
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.category-toggle:hover {
    background: #ffffffa8;
}

.category-toggle.active {
    background: white;
    border-color: var(--border);
}

.arrow {
    font-size: 10px;
    transition: transform .2s;
}

.category-toggle.expanded .arrow {
    transform: rotate(180deg);
}

.nav-items {
    display: none;
    padding: 4px 0 3px 7px;
}

.nav-items.open {
    display: block;
}

.nav-item {
    width: 100%;
    display: block;
    border: 0;
    border-left: 2px solid transparent;
    background: transparent;
    padding: 8px 6px;
    text-align: left;
    font-size: 10px;
    color: #45627e;
    border-radius: 0 5px 5px 0;
    cursor: pointer;
    margin: 2px 0;
}

.nav-item:hover {
    background: #ffffffa8;
    color: var(--text);
}

.nav-item.selected {
    background: white;
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: bold;
}

/* RIGHT CONTENT */

.content {
    min-width: 0;
    overflow-y: auto;
    padding: 12px;
}

.content-header {
    margin-bottom: 12px;
}

.content-header h3 {
    margin: 0;
    font-size: 16px;
}

.content-header p {
    font-size: 11px;
    color: var(--muted);
    margin: 5px 0 0;
    line-height: 1.4;
}

.component-panel {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px;
}

.panel-section {
    margin-bottom: 13px;
}

.panel-section:last-child {
    margin-bottom: 0;
}

.panel-title {
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 7px;
}

.placeholder {
    border: 1px dashed var(--border);
    background: #f8fbff;
    padding: 12px;
    border-radius: 6px;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.5;
}

.code-preview {
    background: #172b45;
    color: #d5f4df;
    padding: 10px;
    border-radius: 6px;
    min-height: 65px;
    font-family: Consolas, monospace;
    font-size: 10px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.component-status {
    display: inline-block;
    padding: 4px 7px;
    background: #eaf3fc;
    border-radius: 4px;
    color: #45627e;
    font-size: 9px;
}

/* STRUCTURE BLOCKS */

.structure-card {
    background: #dcecff;
    border: 1px solid #76aee8;
    border-radius: 7px;
    padding: 10px;
    margin-bottom: 9px;
}

.structure-card.loop {
    background: #e7e1ff;
    border-color: #b6a4ed;
}

.structure-drag {
    padding: 8px;
    background: #ffffffc9;
    border-radius: 5px;
    font-size: 11px;
    font-weight: bold;
    cursor: grab;
    user-select: none;
}

.structure-drag:active {
    cursor: grabbing;
}

.structure-description {
    font-size: 10px;
    color: #45627e;
    margin-top: 7px;
}

.drag-button {
    width: 100%;
    margin-top: 9px;
    padding: 9px;
    border: 0;
    border-radius: 5px;
    background: var(--accent);
    color: white;
    font-size: 11px;
    font-weight: bold;
    cursor: grab;
}

.drag-button:hover {
    background: #007f84;
}

/* EMPTY STATE */

.empty-state {
    text-align: center;
    padding: 30px 10px;
    color: var(--muted);
}

.empty-state .symbol {
    font-size: 28px;
    margin-bottom: 9px;
}

.empty-state strong {
    display: block;
    color: var(--text);
    font-size: 12px;
    margin-bottom: 5px;
}

.empty-state p {
    font-size: 10px;
    line-height: 1.5;
}

/* FOOTER */

.footer {
    min-height: 25px;
    padding: 6px;
    background: white;
    border-top: 1px solid var(--border);
    text-align: center;
    color: var(--muted);
    font-size: 9px;
}

@media (max-width: 360px) {
    .workspace {
        grid-template-columns: 30% 70%;
    }

    .navigation {
        padding: 6px 4px;
    }

    .content {
        padding: 8px;
    }

    .nav-item {
        font-size: 9px;
        padding: 7px 4px;
    }
}


/* BASIC LED COMPONENTS */

.led-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.led-card {
    background: #d9f4df;
    border: 1px solid #85d6a0;
    border-radius: 8px;
    overflow: hidden;
}

.led-card-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px;
    border: 0;
    background: #c9efd5;
    color: #172b45;
    font-weight: bold;
    font-size: 12px;
    text-align: left;
    cursor: pointer;
}

.led-card-header:hover {
    background: #bce8ca;
}

.led-card-content {
    padding: 10px;
}

.led-card-content[hidden] {
    display: none;
}

.led-field {
    margin-bottom: 10px;
}

.led-field label {
    display: block;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 5px;
}

.led-field input,
.led-field select {
    width: 100%;
    padding: 5px 7px;
    min-height: 28px;
    font-size: 10px;
    border: 1px solid #a8bfd8;
    border-radius: 5px;
    background: white;
    color: #172b45;
}

.led-duration-row {
    display: flex;
    gap: 5px;
}

.led-duration-row input {
    flex: 1;
    min-width: 0;
}

.led-duration-row select {
    width: 65px;
}

.led-code {
    background: #172b45;
    color: #d5f4df;
    padding: 9px;
    border-radius: 6px;
    font: 10px Consolas, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    margin-top: 7px;
    max-height: 190px;
    overflow: auto;
}

.led-code-dropdown {
    margin-top: 8px;
    border: 1px solid #c7d7e8;
    border-radius: 5px;
    overflow: hidden;
}

.led-code-dropdown summary {
    padding: 7px 9px;
    background: #edf5fc;
    color: #29445f;
    cursor: pointer;
    font-size: 10px;
    font-weight: bold;
    user-select: none;
}

.led-code-dropdown[open] summary {
    border-bottom: 1px solid #c7d7e8;
}

.led-code-dropdown .led-code {
    margin: 0;
    border-radius: 0;
}

.led-actions {
    display: flex;
    gap: 6px;
    margin-top: 9px;
}

.led-actions button,
.add-led-button {
    flex: 1;
    padding: 9px 6px;
    border: 0;
    border-radius: 5px;
    cursor: pointer;
    font-size: 10px;
    font-weight: bold;
}

.add-led-button {
    width: 100%;
    background: #00979d;
    color: white;
    margin-bottom: 10px;
}

.add-led-button:hover {
    background: #007f84;
}

.led-drag-button {
    background: #00979d;
    color: white;
}

.led-remove-button {
    background: #ffe0e0;
    color: #a52c2c;
}

.led-empty {
    padding: 15px;
    border: 1px dashed #b7cce0;
    border-radius: 6px;
    text-align: center;
    color: #71869c;
    font-size: 10px;
}

</style>
</head>

<body>

<header class="header">
    <h2>Code Blocks</h2>
    <small>Arduino Guide</small>
</header>

<div class="workspace">

    <!-- LEFT NAVIGATION -->
    <aside class="navigation">

        <div class="nav-heading">Categories</div>

        <div class="nav-category">

            <button class="category-toggle"
                    type="button"
                    data-category="program" data-items="programItems">
                Program
                <span class="arrow">▼</span>
            </button>

            <div class="nav-items" id="programItems">

                <button class="nav-item selected"
                        data-type="structure"
                        data-value="setup">
                    Setup
                </button>

                <button class="nav-item"
                        data-type="structure"
                        data-value="loop">
                    Loop
                </button>

            </div>
        </div>

        <div class="nav-category">

            <button class="category-toggle"
                    type="button"
                    data-category="leds" data-items="ledItems">
                LEDs
                <span class="arrow">▼</span>
            </button>

            <div class="nav-items" id="ledItems">

                <button class="nav-item"
                        data-type="component"
                        data-value="basic-led">
                    Basic LED
                </button>

                <button class="nav-item"
                        data-type="component"
                        data-value="led-strip">
                    LED Strip
                </button>

                <button class="nav-item"
                        data-type="component"
                        data-value="pwm-led">
                    PWM LED
                </button>

                <button class="nav-item"
                        data-type="component"
                        data-value="rgb-led">
                    RGB LED
                </button>

                <button class="nav-item"
                        data-type="component"
                        data-value="rgb-strip">
                    RGB LED Strip
                </button>

            </div>
        </div>

        <div class="nav-category">
            <button class="category-toggle" type="button"
                    data-category="simple-outputs" data-items="simpleOutputItems">
                Simple Outputs
                <span class="arrow">▼</span>
            </button>
            <div class="nav-items" id="simpleOutputItems">
                <button class="nav-item" data-type="component" data-value="buzzer">Buzzer</button>
                <button class="nav-item" data-type="component" data-value="vibration-motor">Vibration Motor</button>
                <button class="nav-item" data-type="component" data-value="relay">Relay</button>
                <button class="nav-item" data-type="component" data-value="mosfet-output">MOSFET Output</button>
                <button class="nav-item" data-type="component" data-value="dc-fan">DC Fan</button>
                <button class="nav-item" data-type="component" data-value="solenoid">Solenoid</button>
            </div>
        </div>

    </aside>

    <!-- RIGHT CONTENT -->
    <main class="content" id="content">

        <div class="content-header">
            <h3 id="panelTitle">Setup</h3>
            <p id="panelDescription">
                Runs once when the Arduino starts.
            </p>
        </div>

        <div id="panelContent"></div>

    </main>

</div>

<footer class="footer">
    Select a block to view its options.
</footer>


<script>
/* =========================================================
   CODE BLOCKS — COMPONENTS, STORAGE AND DRAG/DROP
   ========================================================= */

const STORAGE_KEY = "codeBlocks_dragData";

const componentList = {
    "basic-led": {
        title: "Basic LED",
        description: "A standard LED controlled by a digital Arduino pin.",
        storage: "arduino-code-blocks-basic-leds",
        kind: "basic"
    },
    "pwm-led": {
        title: "PWM LED",
        description: "Control LED brightness using an Arduino PWM pin.",
        storage: "arduino-code-blocks-pwm-leds",
        kind: "pwm"
    },
    "rgb-led": {
        title: "RGB LED",
        description: "Control the red, green and blue channels of an RGB LED.",
        storage: "arduino-code-blocks-rgb-leds",
        kind: "rgb"
    },
    "led-strip": {
        title: "LED Strip",
        description: "Control a single-colour LED strip using a MOSFET and an external power supply.",
        storage: "arduino-code-blocks-led-strips",
        kind: "strip"
    },
    "rgb-strip": {
        title: "RGB LED Strip",
        description: "Control an analogue RGB LED strip using three MOSFET channels and an external power supply.",
        storage: "arduino-code-blocks-rgb-strips",
        kind: "rgbStrip"
    },
    "buzzer": {
        title: "Buzzer",
        description: "Control an active buzzer or generate tones with a passive buzzer.",
        storage: "arduino-code-blocks-buzzer",
        kind: "buzzer"
    },
    "vibration-motor": {
        title: "Vibration Motor",
        description: "Pulse a vibration motor for a selected ON and OFF duration.",
        storage: "arduino-code-blocks-vibration-motors",
        kind: "vibration"
    },
    "relay": {
        title: "Relay",
        description: "Switch a relay module on and off with selectable trigger polarity.",
        storage: "arduino-code-blocks-relays",
        kind: "relay"
    },
    "mosfet-output": {
        title: "MOSFET Output",
        description: "Switch an external load through a logic-level MOSFET driver.",
        storage: "arduino-code-blocks-mosfet-outputs",
        kind: "mosfet"
    },
    "dc-fan": {
        title: "DC Fan",
        description: "Switch a DC fan through a suitable transistor or MOSFET driver.",
        storage: "arduino-code-blocks-dc-fans",
        kind: "fan"
    },
    "solenoid": {
        title: "Solenoid",
        description: "Pulse a solenoid through a suitable driver and external power supply.",
        storage: "arduino-code-blocks-solenoids",
        kind: "solenoid"
    }
};

const PWM_PINS = ["3", "5", "6", "9", "10", "11"];
const DIGITAL_PINS = Array.from({ length: 14 }, (_, i) => String(i));

let selectedType = "structure";
let selectedValue = "setup";

const componentData = {
    basic: [],
    pwm: [],
    rgb: [],
    strip: [],
    rgbStrip: [],
    buzzer: [],
    vibration: [],
    relay: [],
    mosfet: [],
    fan: [],
    solenoid: []
};

const nextIds = {
    basic: 1,
    pwm: 1,
    rgb: 1,
    strip: 1,
    rgbStrip: 1,
    buzzer: 1,
    vibration: 1,
    relay: 1,
    mosfet: 1,
    fan: 1,
    solenoid: 1
};

/* =========================================================
   SAFE HELPERS
   ========================================================= */

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function saveDragData(data) {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (error) {
        console.error("Could not save drag data:", error);
    }
}

function saveComponentData(kind) {
    const config = Object.values(componentList).find(item => item.kind === kind);
    if (!config) return;

    try {
        localStorage.setItem(config.storage, JSON.stringify(componentData[kind]));
    } catch (error) {
        console.error(`Could not save ${kind} LED settings:`, error);
    }
}

function loadComponentData(kind) {
    const config = Object.values(componentList).find(item => item.kind === kind);
    if (!config) return;

    try {
        const saved = localStorage.getItem(config.storage);
        if (!saved) return;

        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) {
            componentData[kind] = parsed.map(item => ({
                ...item,
                collapsed: true
            }));
        }
    } catch (error) {
        console.error(`Could not load ${kind} LEDs:`, error);
        componentData[kind] = [];
    }

    nextIds[kind] = componentData[kind].reduce(
        (max, item) => Math.max(max, Number(item.id) || 0),
        0
    ) + 1;

    renumberItems(kind);
}

function saveAllComponentData() {
    ["basic", "pwm", "rgb", "strip", "rgbStrip", "buzzer", "vibration", "relay", "mosfet", "fan", "solenoid"].forEach(saveComponentData);
}

function renumberItems(kind) {
    componentData[kind].forEach((item, index) => {
        if (item.autoName !== false) {
            item.autoName = true;
            const prefix = {
                basic: "LED",
                pwm: "PWM LED",
                rgb: "RGB LED",
                strip: "LED Strip",
                rgbStrip: "RGB Strip",
                buzzer: "Buzzer",
                vibration: "Vibration Motor",
                relay: "Relay",
                mosfet: "MOSFET Output",
                fan: "DC Fan",
                solenoid: "Solenoid"
            }[kind] || "Component";
            item.name = `${prefix} ${index + 1}`;
        }
    });
}

function createItem(kind) {
    const prefixes = {
        basic: "LED", pwm: "PWM LED", rgb: "RGB LED",
        strip: "LED Strip", rgbStrip: "RGB Strip",
        buzzer: "Buzzer", vibration: "Vibration Motor",
        relay: "Relay", mosfet: "MOSFET Output",
        fan: "DC Fan", solenoid: "Solenoid"
    };
    const item = {
        id: nextIds[kind]++,
        name: `${prefixes[kind] || "Component"} ${componentData[kind].length + 1}`,
        autoName: true,
        collapsed: true
    };

    if (kind === "basic") {
        Object.assign(item, {
            pin: "LED_BUILTIN",
            onValue: 1000,
            offValue: 1000,
            onUnit: "ms",
            offUnit: "ms"
        });
    } else if (kind === "pwm" || kind === "strip") {
        Object.assign(item, { pin: "3", brightness: 180, duration: 500 });
    } else if (kind === "rgb" || kind === "rgbStrip") {
        Object.assign(item, {
            redPin: "3", greenPin: "5", bluePin: "6",
            color: "#ff0000",
            commonAnode: kind === "rgbStrip",
            duration: 500
        });
    } else if (kind === "buzzer") {
        Object.assign(item, {
            pin: "6", buzzerType: "passive", frequency: 500,
            onDuration: 500, offDuration: 200
        });
    } else if (["vibration", "relay", "mosfet", "fan", "solenoid"].includes(kind)) {
        Object.assign(item, {
            pin: "6", activeLevel: "HIGH",
            onDuration: 500, offDuration: 200
        });
    }

    componentData[kind].push(item);
    renumberItems(kind);
    saveComponentData(kind);
    return item;
}

function dragPayload(event, payload) {
    saveDragData(payload);
    event.dataTransfer.setData("text/plain", "CODE_BLOCKS");
    event.dataTransfer.effectAllowed = "copy";
}

function dragStructure(event, structure) {
    dragPayload(event, {
        type: "STRUCTURE",
        structure
    });
}

function makeOptions(values, selected, label) {
    return values.map(value => `
        <option value="${escapeHTML(value)}" ${String(value) === String(selected) ? "selected" : ""}>
            ${escapeHTML(label ? label(value) : value)}
        </option>
    `).join("");
}

function durationMs(value) {
    const number = Number(value);
    if (!Number.isFinite(number) || number < 0) return 0;
    return Math.min(2147483647, Math.round(number));
}

function safeComment(value) {
    return String(value || "Component")
        .replace(/[\r\n]/g, " ")
        .replace(/\*\//g, "* /");
}

/* =========================================================
   CODE GENERATORS
   ========================================================= */

function generateCode(kind, item) {
    if (kind === "basic") {
        const pin = item.pin === "LED_BUILTIN" || DIGITAL_PINS.includes(String(item.pin))
            ? item.pin : "LED_BUILTIN";
        const on = durationMs(Number(item.onValue) * (item.onUnit === "s" ? 1000 : 1));
        const off = durationMs(Number(item.offValue) * (item.offUnit === "s" ? 1000 : 1));

        return {
            setup: `pinMode(${pin}, OUTPUT);`,
            loop: `// ${safeComment(item.name)} — Pin ${pin}
digitalWrite(${pin}, HIGH);
delay(${on});
digitalWrite(${pin}, LOW);
delay(${off});`
        };
    }

    if (kind === "pwm") {
        const pin = PWM_PINS.includes(String(item.pin)) ? item.pin : "3";
        const brightness = Math.max(0, Math.min(255, Number(item.brightness) || 0));
        const duration = durationMs(item.duration);

        return {
            setup: `pinMode(${pin}, OUTPUT);`,
            loop: `// ${safeComment(item.name)} — PWM Pin ${pin}
analogWrite(${pin}, ${brightness});
delay(${duration});
analogWrite(${pin}, 0);
delay(${duration});`
        };
    }

    if (kind === "rgb" || kind === "rgbStrip") {
        const pins = [item.redPin, item.greenPin, item.bluePin]
            .map(pin => PWM_PINS.includes(String(pin)) ? String(pin) : "3");
        const channels = hexToRgb(item.color || "#ff0000");
        const values = item.commonAnode
            ? channels.map(value => 255 - value)
            : channels;
        const duration = durationMs(item.duration);
        const label = kind === "rgbStrip" ? "RGB LED Strip" : "RGB LED";

        return {
            setup: pins.map(pin => `pinMode(${pin}, OUTPUT);`).join("\n"),
            loop: `// ${safeComment(item.name)} — ${label}
analogWrite(${pins[0]}, ${values[0]}); // Red
analogWrite(${pins[1]}, ${values[1]}); // Green
analogWrite(${pins[2]}, ${values[2]}); // Blue
delay(${duration});`
        };
    }
 
    if (kind === "strip") {
        const pin = PWM_PINS.includes(String(item.pin)) ? item.pin : "3";
        const brightness = Math.max(0, Math.min(255, Number(item.brightness) || 0));
        const duration = durationMs(item.duration);

        return {
            setup: `pinMode(${pin}, OUTPUT);`,
            loop: `// ${safeComment(item.name)} — LED Strip
analogWrite(${pin}, ${brightness});
delay(${duration});
analogWrite(${pin}, 0);
delay(${duration});`
        };
    }

    if (kind === "buzzer") {
        const pin = DIGITAL_PINS.includes(String(item.pin)) && Number(item.pin) >= 2
            ? String(item.pin) : "6";
        const on = durationMs(item.onDuration);
        const off = durationMs(item.offDuration);
        const frequency = Math.max(31, Math.min(5000, Math.round(Number(item.frequency) || 500)));
        const setup = `pinMode(${pin}, OUTPUT);\ndigitalWrite(${pin}, LOW);`;

        if (item.buzzerType === "active") {
            return {
                setup,
                loop: `// ${safeComment(item.name)} — Active buzzer, Pin ${pin}
digitalWrite(${pin}, HIGH);
delay(${on});
digitalWrite(${pin}, LOW);
delay(${off});`
            };
        }

        return {
            setup,
            loop: `// ${safeComment(item.name)} — Passive buzzer, Pin ${pin}
tone(${pin}, ${frequency});
delay(${on});
noTone(${pin});
delay(${off});`
        };
    }

    if (["vibration", "relay", "mosfet", "fan", "solenoid"].includes(kind)) {
        const pin = DIGITAL_PINS.includes(String(item.pin)) && Number(item.pin) >= 2
            ? String(item.pin) : "6";
        const active = item.activeLevel === "LOW" ? "LOW" : "HIGH";
        const inactive = active === "HIGH" ? "LOW" : "HIGH";
        const on = durationMs(item.onDuration);
        const off = durationMs(item.offDuration);
        const labels = {
            vibration: "Vibration motor",
            relay: "Relay",
            mosfet: "MOSFET output",
            fan: "DC fan",
            solenoid: "Solenoid"
        };

        return {
            setup: `pinMode(${pin}, OUTPUT);
digitalWrite(${pin}, ${inactive});`,
            loop: `// ${safeComment(item.name)} — ${labels[kind]}, Pin ${pin}
digitalWrite(${pin}, ${active});
delay(${on});
digitalWrite(${pin}, ${inactive});
delay(${off});`
        };
    }

    return { setup: "", loop: "" };
}

function hexToRgb(hex) {
    const match = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(String(hex));
    if (!match) return [255, 0, 0];
    return [
        parseInt(match[1], 16),
        parseInt(match[2], 16),
        parseInt(match[3], 16)
    ];
}

/* =========================================================
   NAVIGATION — CLOSED BY DEFAULT
   ========================================================= */

document.querySelectorAll(".category-toggle").forEach(button => {
    button.addEventListener("click", () => {
        const id = button.dataset.items ||
            (button.dataset.category === "program" ? "programItems" : "ledItems");
        const items = document.getElementById(id);
        if (!items) return;

        const open = items.classList.toggle("open");
        button.classList.toggle("expanded", open);
        button.classList.toggle("active", open);
    });
});

document.querySelectorAll(".nav-item").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelectorAll(".nav-item").forEach(item => item.classList.remove("selected"));
        button.classList.add("selected");

        selectedType = button.dataset.type;
        selectedValue = button.dataset.value;
        renderPanel();
    });
});

/* =========================================================
   MAIN PANEL
   ========================================================= */

function renderPanel() {
    const title = document.getElementById("panelTitle");
    const description = document.getElementById("panelDescription");
    const content = document.getElementById("panelContent");
    if (!title || !description || !content) return;

    content.innerHTML = "";

    if (selectedType === "structure") {
        const isSetup = selectedValue === "setup";
        const name = isSetup ? "Setup" : "Loop";
        const structure = isSetup ? "setup" : "loop";

        title.textContent = name;
        description.textContent = isSetup
            ? "Runs once when the Arduino starts."
            : "Runs repeatedly while the Arduino is powered.";

        content.innerHTML = `
            <div class="structure-card ${isSetup ? "" : "loop"}">
                <div class="structure-drag" draggable="true" id="structureDrag">
                    ⠿ ${name.toUpperCase()} — void ${structure}()
                </div>
                <div class="structure-description">
                    ${isSetup
                        ? "Place initialization code here, such as pinMode() and Serial.begin()."
                        : "Place repeating instructions here."}
                </div>
            </div>
            <div class="panel-section">
                <div class="panel-title">Description</div>
                <div class="placeholder">
                    ${isSetup
                        ? "The setup() function executes once after the Arduino starts or resets."
                        : "The loop() function repeats continuously after setup() has completed."}
                </div>
            </div>
            <button class="drag-button" id="structureButton" draggable="true">
                ⠿ Drag ${name} into editor
            </button>
        `;

        document.getElementById("structureDrag").addEventListener("dragstart", e => dragStructure(e, structure));
        document.getElementById("structureButton").addEventListener("dragstart", e => dragStructure(e, structure));
        return;
    }

    const component = componentList[selectedValue];
    if (selectedType !== "component" || !component) return;

    title.textContent = component.title;
    description.textContent = component.description;

    if (component.kind) {
        renderComponentPanel(content, component.kind);
        return;
    }

    content.innerHTML = `
        <div class="component-panel">
            <div class="panel-section">
                <span class="component-status">Not implemented yet</span>
            </div>
            <div class="panel-section">
                <div class="placeholder">
                    ${escapeHTML(component.description)}
                    This component will be implemented separately.
                </div>
            </div>
        </div>
    `;
}

/* =========================================================
   COMPONENT PANEL — SHARED CARD RENDERER
   ========================================================= */

function renderComponentPanel(content, kind) {
    const labels = {
        basic: "Add Basic LED",
        pwm: "Add PWM LED",
        rgb: "Add RGB LED",
        strip: "Add LED Strip",
        rgbStrip: "Add RGB LED Strip",
        buzzer: "Add Buzzer",
        vibration: "Add Vibration Motor",
        relay: "Add Relay",
        mosfet: "Add MOSFET Output",
        fan: "Add DC Fan",
        solenoid: "Add Solenoid"
    };

    content.innerHTML = `
        <button class="add-led-button" id="addComponent" type="button">
            + ${labels[kind]}
        </button>
        <div class="led-list" id="componentList"></div>
    `;

    document.getElementById("addComponent").addEventListener("click", () => {
        createItem(kind);
        renderComponentPanel(content, kind);
    });

    const list = document.getElementById("componentList");
    const items = componentData[kind];

    if (!items.length) {
        list.innerHTML = `
            <div class="led-empty">
                No components added yet.<br>
                Click the button above to add one.
            </div>
        `;
        return;
    }

    items.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = `led-card ${kind}-card`;
        card.dataset.itemId = item.id;

        card.innerHTML = `
            <button class="led-card-header" type="button" aria-expanded="${!item.collapsed}">
                <span class="led-card-name">${escapeHTML(item.name)}</span>
                <span class="led-card-toggle">${item.collapsed ? "+" : "−"}</span>
            </button>
            <div class="led-card-content" ${item.collapsed ? "hidden" : ""}>
                ${renderFields(kind, item)}
                <details class="led-code-dropdown">
                    <summary>Show generated code</summary>
                    <div class="led-code"></div>
                </details>
                <div class="led-actions">
                    <button class="led-drag-button" type="button" draggable="true">⠿ Drag to editor</button>
                    <button class="led-remove-button" type="button">Remove</button>
                </div>
            </div>
        `;

        list.appendChild(card);
        bindCardEvents(card, item, kind, index);
        updatePreview(card, item, kind);
    });
}

function renderFields(kind, item) {
    if (kind === "basic") {
        return `
            <div class="led-field">
                <label>LED Name</label>
                <input type="text" data-field="name" value="${escapeHTML(item.name)}">
            </div>
            <div class="led-field">
                <label>Arduino Pin</label>
                <select data-field="pin">
                    ${makeOptions(["LED_BUILTIN", ...DIGITAL_PINS], item.pin,
                        value => value === "LED_BUILTIN" ? "Built-in LED" : `Digital Pin ${value}`)}
                </select>
            </div>
            ${durationField("ON Duration", "onValue", "onUnit", item.onValue, item.onUnit)}
            ${durationField("OFF Duration", "offValue", "offUnit", item.offValue, item.offUnit)}
        `;
    }

    if (kind === "pwm") {
        return `
            <div class="led-field">
                <label>LED Name</label>
                <input type="text" data-field="name" value="${escapeHTML(item.name)}">
            </div>
            <div class="led-field">
                <label>PWM Pin (Arduino Uno)</label>
                <select data-field="pin">
                    ${makeOptions(PWM_PINS, item.pin, value => `PWM Pin ${value}`)}
                </select>
            </div>
            <div class="led-field">
                <label>Brightness: <span data-value-label="brightness">${item.brightness}</span> / 255</label>
                <input type="range" min="0" max="255" step="1" data-field="brightness" value="${item.brightness}">
            </div>
            <div class="led-field">
                <label>ON / OFF Duration (ms)</label>
                <input type="number" min="0" max="2147483647" step="1" data-field="duration" value="${item.duration}">
            </div>
            <div class="placeholder">
                PWM controls brightness from 0 (off) to 255 (maximum). Use a PWM-capable pin marked with ~ on the board.
            </div>
        `;
    }

    if (kind === "strip") {
        return `
            <div class="led-field">
                <label>Strip Name</label>
                <input type="text" data-field="name" value="${escapeHTML(item.name)}">
            </div>
            <div class="led-field">
                <label>MOSFET Gate PWM Pin (Arduino Uno)</label>
                <select data-field="pin">
                    ${makeOptions(PWM_PINS, item.pin, value => `PWM Pin ${value}`)}
                </select>
            </div>
            <div class="led-field">
                <label>Brightness: <span data-value-label="brightness">${item.brightness}</span> / 255</label>
                <input type="range" min="0" max="255" step="1" data-field="brightness" value="${item.brightness}">
            </div>
            <div class="led-field">
                <label>ON / OFF Duration (ms)</label>
                <input type="number" min="0" max="2147483647" step="1" data-field="duration" value="${item.duration}">
            </div>
            <div class="placeholder">
                Use a suitable logic-level MOSFET and an external supply matched to the strip voltage. Connect Arduino GND and supply negative together. Do not power a long strip directly from an Arduino pin.
            </div>
        `;
    }

    if (kind === "rgbStrip") {
        return `
            <div class="led-field">
                <label>RGB Strip Name</label>
                <input type="text" data-field="name" value="${escapeHTML(item.name)}">
            </div>
            <div class="led-field">
                <label>Strip Colour</label>
                <input type="color" data-field="color" value="${escapeHTML(item.color)}">
            </div>
            <div class="led-field">
                <label>Red MOSFET Gate PWM Pin</label>
                <select data-field="redPin">${makeOptions(PWM_PINS, item.redPin, value => `PWM ${value}`)}</select>
            </div>
            <div class="led-field">
                <label>Green MOSFET Gate PWM Pin</label>
                <select data-field="greenPin">${makeOptions(PWM_PINS, item.greenPin, value => `PWM ${value}`)}</select>
            </div>
            <div class="led-field">
                <label>Blue MOSFET Gate PWM Pin</label>
                <select data-field="bluePin">${makeOptions(PWM_PINS, item.bluePin, value => `PWM ${value}`)}</select>
            </div>
            <div class="led-field">
                <label>RGB Strip Type</label>
                <select data-field="commonAnode">
                    <option value="true" ${item.commonAnode ? "selected" : ""}>Common positive (common anode)</option>
                    <option value="false" ${!item.commonAnode ? "selected" : ""}>Common negative (common cathode)</option>
                </select>
            </div>
            <div class="led-field">
                <label>Display Duration (ms)</label>
                <input type="number" min="0" max="2147483647" step="1" data-field="duration" value="${item.duration}">
            </div>
            <div class="placeholder">
                Use three suitable logic-level MOSFETs and an external supply. Connect Arduino GND to supply negative. Each colour channel needs its own MOSFET.
            </div>
        `;
    }

    if (kind === "buzzer") {
        const pins = DIGITAL_PINS.filter(pin => Number(pin) >= 2);
        return `
            <div class="led-field">
                <label>Buzzer Name</label>
                <input type="text" data-field="name" value="${escapeHTML(item.name)}">
            </div>
            <div class="led-field">
                <label>Buzzer Type</label>
                <select data-field="buzzerType">
                    <option value="active" ${item.buzzerType === "active" ? "selected" : ""}>Active — simple ON / OFF</option>
                    <option value="passive" ${item.buzzerType !== "active" ? "selected" : ""}>Passive — play a tone</option>
                </select>
            </div>
            <div class="led-field">
                <label>Digital Pin</label>
                <select data-field="pin">${makeOptions(pins, item.pin, pin => `Digital Pin ${pin}`)}</select>
            </div>
            <div class="led-field" data-buzzer-frequency ${item.buzzerType === "active" ? "hidden" : ""}>
                <label>Tone Frequency (Hz)</label>
                <input type="number" min="31" max="5000" step="1" data-field="frequency" value="${item.frequency}">
            </div>
            <div class="led-field">
                <label>ON Duration (ms)</label>
                <input type="number" min="0" max="2147483647" step="1" data-field="onDuration" value="${item.onDuration}">
            </div>
            <div class="led-field">
                <label>OFF Duration (ms)</label>
                <input type="number" min="0" max="2147483647" step="1" data-field="offDuration" value="${item.offDuration}">
            </div>
            <div class="placeholder">An active buzzer makes its built-in tone when powered. A passive buzzer uses tone() to generate the selected frequency.</div>
        `;
    }

    if (["vibration", "relay", "mosfet", "fan", "solenoid"].includes(kind)) {
        const names = {
            vibration: "Vibration Motor",
            relay: "Relay",
            mosfet: "MOSFET Output",
            fan: "DC Fan",
            solenoid: "Solenoid"
        };
        const notes = {
            vibration: "Drive the motor through a transistor or motor-driver module. Do not connect a bare motor directly to an Arduino pin.",
            relay: "Use a relay module or a properly driven relay coil. Check whether your module is active-high or active-low before connecting a load.",
            mosfet: "Use a logic-level MOSFET driver suitable for the load. Share ground between the Arduino and the external supply where required.",
            fan: "Use a suitable transistor or logic-level MOSFET, external fan supply and flyback protection where applicable. Never power a fan directly from an Arduino pin.",
            solenoid: "Use a suitable transistor or MOSFET driver, an external supply and a flyback diode across a DC solenoid coil. Never drive the coil directly from an Arduino pin."
        };
        const pinOptions = DIGITAL_PINS.filter(pin => Number(pin) >= 2);
        return `
            <div class="led-field">
                <label>${names[kind]} Name</label>
                <input type="text" data-field="name" value="${escapeHTML(item.name)}">
            </div>
            <div class="led-field">
                <label>Digital Control Pin</label>
                <select data-field="pin">${makeOptions(pinOptions, item.pin, pin => `Digital Pin ${pin}`)}</select>
            </div>
            <div class="led-field">
                <label>Active Signal</label>
                <select data-field="activeLevel">
                    <option value="HIGH" ${item.activeLevel !== "LOW" ? "selected" : ""}>HIGH — active when pin is HIGH</option>
                    <option value="LOW" ${item.activeLevel === "LOW" ? "selected" : ""}>LOW — active when pin is LOW</option>
                </select>
            </div>
            <div class="led-field">
                <label>ON Duration (ms)</label>
                <input type="number" min="0" max="2147483647" step="1" data-field="onDuration" value="${item.onDuration}">
            </div>
            <div class="led-field">
                <label>OFF Duration (ms)</label>
                <input type="number" min="0" max="2147483647" step="1" data-field="offDuration" value="${item.offDuration}">
            </div>
            <div class="placeholder">${notes[kind]}</div>
        `;
    }

    return `
        <div class="led-field">
            <label>RGB LED Name</label>
            <input type="text" data-field="name" value="${escapeHTML(item.name)}">
        </div>
        <div class="led-field">
            <label>LED Colour</label>
            <input type="color" data-field="color" value="${escapeHTML(item.color)}">
        </div>
        <div class="led-field">
            <label>Red PWM Pin</label>
            <select data-field="redPin">${makeOptions(PWM_PINS, item.redPin, value => `PWM ${value}`)}</select>
        </div>
        <div class="led-field">
            <label>Green PWM Pin</label>
            <select data-field="greenPin">${makeOptions(PWM_PINS, item.greenPin, value => `PWM ${value}`)}</select>
        </div>
        <div class="led-field">
            <label>Blue PWM Pin</label>
            <select data-field="bluePin">${makeOptions(PWM_PINS, item.bluePin, value => `PWM ${value}`)}</select>
        </div>
        <div class="led-field">
            <label>RGB LED Type</label>
            <select data-field="commonAnode">
                <option value="false" ${!item.commonAnode ? "selected" : ""}>Common cathode</option>
                <option value="true" ${item.commonAnode ? "selected" : ""}>Common anode</option>
            </select>
        </div>
        <div class="led-field">
            <label>Display Duration (ms)</label>
            <input type="number" min="0" max="2147483647" step="1" data-field="duration" value="${item.duration}">
        </div>
        <div class="placeholder">
            Use three PWM pins and a current-limiting resistor for each colour channel. The selected colour is converted to RGB values.
        </div>
    `;
}

function durationField(label, valueField, unitField, value, unit) {
    return `
        <div class="led-field">
            <label>${label}</label>
            <div class="led-duration-row">
                <input type="number" min="0" step="any" data-field="${valueField}" value="${escapeHTML(value)}">
                <select data-field="${unitField}">
                    <option value="ms" ${unit === "ms" ? "selected" : ""}>ms</option>
                    <option value="s" ${unit === "s" ? "selected" : ""}>seconds</option>
                </select>
            </div>
        </div>
    `;
}

/* =========================================================
   COMPONENT CARD EVENTS
   ========================================================= */

function bindCardEvents(card, item, kind, index) {
    const header = card.querySelector(".led-card-header");
    const cardContent = card.querySelector(".led-card-content");
    const toggle = card.querySelector(".led-card-toggle");

    header.addEventListener("click", () => {
        item.collapsed = !item.collapsed;
        cardContent.hidden = item.collapsed;
        toggle.textContent = item.collapsed ? "+" : "−";
        header.setAttribute("aria-expanded", String(!item.collapsed));
        saveComponentData(kind);
    });

    card.querySelectorAll("[data-field]").forEach(input => {
        const update = () => {
            const field = input.dataset.field;

            if (field === "commonAnode") {
                item.commonAnode = input.value === "true";
            } else if (field === "name") {
                item.name = input.value;
                item.autoName = false;
                card.querySelector(".led-card-name").textContent = item.name || "Unnamed component";
            } else if (field === "brightness" || field === "duration" ||
                       field === "onValue" || field === "offValue") {
                item[field] = input.value;
            } else {
                item[field] = input.value;
            }

            const valueLabel = card.querySelector(`[data-value-label="${field}"]`);
            if (valueLabel) valueLabel.textContent = input.value;

            if (field === "buzzerType") {
                const frequencyField = card.querySelector("[data-buzzer-frequency]");
                if (frequencyField) frequencyField.hidden = item.buzzerType === "active";
            }

            updatePreview(card, item, kind);
            saveComponentData(kind);
        };

        input.addEventListener("input", update);
        input.addEventListener("change", update);
    });

    card.querySelector(".led-drag-button").addEventListener("dragstart", event => {
        const generated = generateCode(kind, item);
        const type = {
            basic: "LED",
            pwm: "PWM_LED",
            rgb: "RGB_LED",
            strip: "LED_STRIP",
            rgbStrip: "RGB_LED_STRIP",
            buzzer: "BUZZER",
            vibration: "VIBRATION_MOTOR",
            relay: "RELAY",
            mosfet: "MOSFET_OUTPUT",
            fan: "DC_FAN",
            solenoid: "SOLENOID"
        }[kind];

        dragPayload(event, {
            type,
            id: item.id,
            name: item.name,
            setup: generated.setup,
            loop: generated.loop,
            component: { ...item }
        });
    });

    card.querySelector(".led-remove-button").addEventListener("click", () => {
        componentData[kind] = componentData[kind].filter(entry => entry.id !== item.id);
        renumberItems(kind);
        saveComponentData(kind);
        renderComponentPanel(document.getElementById("panelContent"), kind);
    });
}

function updatePreview(card, item, kind) {
    const preview = card.querySelector(".led-code");
    if (!preview) return;

    const code = generateCode(kind, item);
    preview.textContent = `SETUP:\n${code.setup}\n\nLOOP:\n${code.loop}`;
}

/* =========================================================
   INITIALIZE
   ========================================================= */

loadComponentData("basic");
loadComponentData("pwm");
loadComponentData("rgb");
loadComponentData("strip");
loadComponentData("rgbStrip");
loadComponentData("buzzer");
loadComponentData("vibration");
loadComponentData("relay");
loadComponentData("mosfet");
loadComponentData("fan");
loadComponentData("solenoid");

/* Categories and individual component cards start collapsed. */
document.querySelectorAll(".nav-items").forEach(items => items.classList.remove("open"));
document.querySelectorAll(".category-toggle").forEach(button => {
    button.classList.remove("expanded", "active");
});

renderPanel();
</script>
