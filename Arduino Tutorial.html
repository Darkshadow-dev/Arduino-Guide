<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Arduino Guide – Tutorials</title>

<style>

/* ---------------- GENERAL ---------------- */

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:system-ui,Arial,sans-serif;
background:#fafafa;
color:#333;
}

/* ---------------- HEADER ---------------- */

header{
position:sticky;
top:0;
z-index:10;

background:#2b7cff;
color:white;

padding:14px 24px;

display:flex;
align-items:center;
justify-content:space-between;

box-shadow:0 2px 6px rgba(0,0,0,0.15);
}

header h1{
margin:0;
font-size:20px;
}

nav a{
color:white;
text-decoration:none;
margin-left:18px;
font-weight:600;
font-size:14px;
}

nav a:hover{
opacity:0.85;
}

/* ---------------- LAYOUT ---------------- */

.container{
display:flex;
height:calc(100vh - 60px);
}

/* ---------------- SIDEBAR ---------------- */

.sidebar{
width:260px;
background:#ffffff;
border-right:1px solid #ddd;

padding:18px;

overflow-y:auto;
}

.sidebar h3{
margin-top:0;
font-size:18px;
}

/* tutorial buttons */

.sidebar button{
display:block;
width:100%;

margin:8px 0;
padding:10px 12px;

border:none;
border-radius:6px;

background:#f1f1f1;
cursor:pointer;

text-align:left;
font-size:14px;

transition:all .15s ease;
}

.sidebar button:hover{
background:#e4efff;
transform:translateX(4px);
}

.sidebar button.active{
background:#2b7cff;
color:white;
}

/* ---------------- CONTENT ---------------- */

.content{
flex:1;

padding:40px;

overflow:auto;
text-align:center;
}

/* hero placeholder */

.placeholder{
max-width:650px;
margin:auto;

padding:40px 20px;

border:2px dashed #ccc;
border-radius:10px;

background:#fff;
}

.placeholder h2{
margin-top:0;
}

.placeholder p{
line-height:1.6;
color:#555;
}

/* viewer */

.viewer{
margin-top:20px;
}

.viewer img{
max-width:520px;
border-radius:6px;
border:1px solid #ccc;
}

/* text */

.text{
margin-top:20px;
font-size:16px;
max-width:650px;
margin-left:auto;
margin-right:auto;
line-height:1.6;
}

/* controls */

.controls{
margin-top:20px;
}

.controls button{
padding:10px 18px;
margin:5px;

border:none;
border-radius:6px;

background:#2b7cff;
color:white;

font-size:14px;
cursor:pointer;

transition:.15s;
}

.controls button:hover{
background:#1e63d6;
transform:translateY(-2px);
}

/* code block */

.code{
margin-top:28px;

background:#111;
color:#0f0;

padding:16px;

border-radius:8px;

font-family:monospace;
font-size:14px;

white-space:pre;
overflow:auto;

max-width:700px;
margin-left:auto;
margin-right:auto;

text-align:left;
}

/* ---------------- MOBILE ---------------- */

@media (max-width:900px){

.container{
flex-direction:column;
height:auto;
}

.sidebar{
width:100%;
border-right:none;
border-bottom:1px solid #ddd;
}

.content{
padding:25px 15px;
}

}

</style>

</head>

<body>

<header>

<h1>Arduino Guide Tutorials</h1>

<nav>
<a href="Arduino Guide.html#home">Home</a>
<a href="Arduino Guide.html#examples">Examples</a>
<a href="#">Tutorials</a>
</nav>

</header>

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<h3>Tutorials</h3>

<div id="tutorialList">

<button disabled>Coming Soon</button>

</div>

</div>

<!-- CONTENT -->

<div class="content">

<div class="placeholder">

<h2>Tutorials Coming Soon</h2>

<p>
This page will contain step-by-step Arduino tutorials with images,
instructions, and code examples.
</p>

<p>
Select a tutorial from the left sidebar once tutorials are added.
</p>

</div>

<h1 id="title"></h1>

<div class="viewer">
<img id="stepImage" style="display:none">
</div>

<div class="text" id="stepText"></div>

<div class="controls" style="display:none" id="controls">

<button onclick="prevStep()">Previous</button> <button onclick="nextStep()">Next</button>

</div>

<div class="code" id="codeBlock" style="display:none"></div>

</div>

</div>

<script>

/* tutorial system ready */

let tutorials={};

let currentTutorial=null;
let step=0;

function startTutorial(name){

currentTutorial=tutorials[name];
step=0;

document.getElementById("title").innerText=currentTutorial.title;

document.getElementById("controls").style.display="block";

showStep();

}

function showStep(){

let s=currentTutorial.steps[step];

let img=document.getElementById("stepImage");
img.src=s.img;
img.style.display="block";

document.getElementById("stepText").innerText=s.text;

}

function nextStep(){

if(step<currentTutorial.steps.length-1){

step++;
showStep();

}else{

document.getElementById("stepImage").style.display="none";

document.getElementById("stepText").innerText="Final Step: Upload the code below.";

let code=document.getElementById("codeBlock");

code.style.display="block";
code.innerText=currentTutorial.code;

}

}

function prevStep(){

if(step>0){

step--;

showStep();

document.getElementById("codeBlock").style.display="none";

}

}

</script>

</body>
</html>
