<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Arduino Guide – Tutorials</title>

<style>
*{box-sizing:border-box;}

body{
margin:0;
font-family:system-ui,Arial,sans-serif;
background:#fafafa;
color:#333;
}

/* HEADER */
header{
position:sticky;
top:0;
z-index:10;
background:#2b7cff;
color:white;
padding:14px 24px;
display:flex;
align-items:center;
justify-content:space-between;
box-shadow:0 2px 6px rgba(0,0,0,0.15);
}

header h1{margin:0;font-size:20px;}

nav{
display:flex;
align-items:center;
flex-wrap:wrap;
}

nav a{
color:white;
text-decoration:none;
margin-left:14px;
font-weight:600;
font-size:14px;
padding:6px 8px;
border-radius:6px;
}

nav a:hover{
background:rgba(255,255,255,0.2);
}

/* LAYOUT */
.container{
display:flex;
height:calc(100vh - 60px);
}

/* SIDEBAR */
.sidebar{
width:260px;
background:#ffffff;
border-right:1px solid #ddd;
padding:18px;
overflow-y:auto;
}

.sidebar h3{margin-top:0;}

.sidebar button{
display:block;
width:100%;
margin:6px 0;
padding:10px;
border:none;
border-radius:6px;
background:#f1f1f1;
cursor:pointer;
text-align:left;
transition:.15s;
}

.sidebar button:hover{
background:#e4efff;
transform:translateX(4px);
}

.sidebar button.active{
background:#2b7cff;
color:white;
}

/* CONTENT */
.content{
flex:1;
padding:40px;
overflow:auto;
text-align:center;
}

.placeholder{
max-width:650px;
margin:auto;
padding:30px;
border:2px dashed #ccc;
border-radius:10px;
background:#fff;
}

/* STEP VIEW */
.viewer img{
max-width:420px;
border-radius:6px;
border:1px solid #ccc;
}

.text{
margin-top:20px;
max-width:650px;
margin:auto;
line-height:1.6;
}

/* CONTROLS */
.controls button{
padding:10px 18px;
margin:5px;
border:none;
border-radius:6px;
background:#2b7cff;
color:white;
cursor:pointer;
}

.controls button:hover{
background:#1e63d6;
}

/* CODE */
.code{
margin-top:25px;
background:#111;
color:#0f0;
padding:16px;
border-radius:8px;
font-family:monospace;
white-space:pre;
max-width:700px;
margin-left:auto;
margin-right:auto;
text-align:left;
}

/* MOBILE */
@media (max-width:900px){
.container{flex-direction:column;height:auto;}
.sidebar{width:100%;border-right:none;border-bottom:1px solid #ddd;}
.content{padding:20px;}
}
</style>
</head>

<body>

<header>
<h1>Arduino Tutorials</h1>

<nav>
<a href="Arduino Guide.html#home">home</a>
<a href="Arduino Guide.html#examples">Examples</a>
<a href="Arduino Quizz.html">Quiz</a>
<a href="#">Tutorials</a>
<a href="Arduino Community.html">Community</a>
<a href="Arduino Code.html">Code</a>
</nav>
</header>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>Lessons</h3>
<div id="tutorialList"></div>
</div>

<!-- CONTENT -->
<div class="content">

<div class="placeholder" id="placeholder">
<h2>Select a Tutorial</h2>
<p>Each tutorial takes 30–60 minutes and teaches one real skill.</p>
</div>

<h1 id="title"></h1>

<div class="viewer">
<img id="stepImage" style="display:none">
</div>

<div class="text" id="stepText"></div>

<div class="controls" id="controls" style="display:none">
<button onclick="prevStep()">⬅ Prev</button>
<button onclick="nextStep()">Next ➡</button>
</div>

<div class="code" id="codeBlock" style="display:none"></div>

</div>
</div>

<script>

/* ===== REAL TUTORIALS ===== */

let tutorials = {

"LED Blink":{
title:"LED Blink (Beginner)",
steps:[
{img:"",text:"🎯 Goal: Make LED blink every second."},
{img:"",text:"🔌 Connect LED to pin 13 with resistor."},
{img:"",text:"💡 This will teach OUTPUT control."}
],
code:`void setup(){
pinMode(13, OUTPUT);
}

void loop(){
digitalWrite(13, HIGH);
delay(1000);
digitalWrite(13, LOW);
delay(1000);
}`
},

"Button Control":{
title:"Button Control",
steps:[
{img:"",text:"🎯 Goal: Turn LED on with button."},
{img:"",text:"🔌 Button to pin 2, LED to 13."},
{img:"",text:"💡 Learn INPUT + logic."}
],
code:`int btn=2;
int led=13;

void setup(){
pinMode(btn, INPUT);
pinMode(led, OUTPUT);
}

void loop(){
if(digitalRead(btn)){
digitalWrite(led, HIGH);
}else{
digitalWrite(led, LOW);
}
}`
},

"Auto Light":{
title:"Auto Light Sensor",
steps:[
{img:"",text:"🎯 Goal: LED turns ON in dark."},
{img:"",text:"🔌 Sensor to A0."},
{img:"",text:"💡 Learn analog input."}
],
code:`int s=A0;
int led=13;

void setup(){
pinMode(led, OUTPUT);
}

void loop(){
if(analogRead(s)<500){
digitalWrite(led, HIGH);
}else{
digitalWrite(led, LOW);
}
}`
}

};

/* ===== SYSTEM ===== */

let currentTutorial=null;
let step=0;

/* BUILD SIDEBAR */
const list=document.getElementById("tutorialList");

Object.keys(tutorials).forEach(name=>{
let b=document.createElement("button");
b.innerText=name;
b.onclick=()=>{
document.querySelectorAll(".sidebar button").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
startTutorial(name);
};
list.appendChild(b);
});

/* START */
function startTutorial(name){
currentTutorial=tutorials[name];
step=0;

document.getElementById("placeholder").style.display="none";
document.getElementById("controls").style.display="block";

document.getElementById("title").innerText=currentTutorial.title;

showStep();
}

/* SHOW STEP */
function showStep(){
let s=currentTutorial.steps[step];

document.getElementById("stepText").innerText=s.text;

let img=document.getElementById("stepImage");
if(s.img){
img.src=s.img;
img.style.display="block";
}else{
img.style.display="none";
}
}

/* NEXT */
function nextStep(){
if(step < currentTutorial.steps.length-1){
step++;
showStep();
}else{
document.getElementById("stepText").innerText="💻 Final Code:";
let code=document.getElementById("codeBlock");
code.style.display="block";
code.innerText=currentTutorial.code;
}
}

/* PREV */
function prevStep(){
if(step>0){
step--;
showStep();
document.getElementById("codeBlock").style.display="none";
}
}

</script>

</body>
</html>
