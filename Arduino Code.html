<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="Images/Website-Guide.png">
<title>Arduino IDE Web</title>

<style>
body{
  margin:0;
  font-family:monospace;
  background:#0b0f1a;
  color:white;
}

header{
  display:flex;
  gap:10px;
  padding:10px;
  background:#111827;
  align-items:center;
}
html, body{

  height:100%;
}



button{
  background:#1f2a44;
  color:white;
  border:none;
  padding:6px 10px;
  cursor:pointer;
}
button:hover{background:#2c3e66}

#editorWrap{
  display:flex;
  height:calc(100vh - 120px);
}

/* LEFT LINE NUMBERS */
#lineNums{
  width:50px;
  background:#0f172a;
  padding:10px 5px;
  color:#666;
  text-align:right;
  font-size:14px;
  line-height:1.4;
  overflow:hidden;
}

/* EDITOR BOX */
#editorBox{
  position:relative;
  flex:1;
}

/* BOTH LAYERS */
#editor, #highlight{
  position:absolute;
  inset:0;
  font-family:monospace;
  font-size:14px;
  line-height:1.4;
  padding:10px;
  white-space:pre-wrap;   /* 🔥 FIX GAP + WRAP */
  word-wrap:break-word;
  overflow:auto;
  margin:0;
  border:none;
}

/* SYNTAX LAYER */
#highlight{
  pointer-events:none;
  z-index:1;
}

/* TEXT INPUT */
#editor{
  background:transparent;
  color:transparent;
  caret-color:#00ff99;
  z-index:2;
  resize:none;
  outline:none;
}

/* CONSOLE */
#console{
  height:120px;
  background:#575251;
  color:#0f0;
  overflow:auto;
  padding:10px;
}

select{
  background:#111827;
  color:white;
}
::-webkit-scrollbar{display:none}

</style>

</head>

<body>
<input type="file" id="fileInput" style="display:none" accept=".ino,.txt,.cpp,.h,.c">
<header>

<button onclick="newProject()">New</button>

<button onclick="document.getElementById('fileInput').click()">Open</button>

<button onclick="saveFile()">Save</button>

<button onclick="compileCode()">Compile</button>

<select id="examples" onchange="loadExample(this.value)">
  <option value="">Examples</option>
  <option value="blink">Blink</option>
  <option value="button">Button</option>
  <option value="button-led">Button LED</option>
  <option value="pwm">PWM</option>
  <option value="multi-led">Multi LED</option>
  <option value="buzzer">Buzzer</option>
  <option value="analog">Analog</option>
  <option value="joystick">Joystick</option>
  <option value="serial">Serial</option>
  <option value="timer">Timer</option>
</select>

<input id="filename" value="project">
<button onclick="location.href='Arduino Guide.html#home'">Home</button>
<button onclick="location.href='Examples.html#examples'">Examples</button>
<button onclick="location.href='Arduino Quiz.html'">Quizes</button>
<button onclick="location.href='Arduino Tutorial.html#home'">Tutorials</button>
<button onclick="location.href='https://darkshadow-dev.github.io/community/Arduino%20Community.html'">Community</button>
<button onclick="location.href='Arduino Uno.html'">Test</button>
<div class="live-counter" id="liveCounter">
  <span class="dot"></span>
  Online: <span id="onlineCount">0</span>
</div>
</header>

<div id="editorWrap">
  <div id="lineNums"></div>
  <div id="editorBox">
    <pre id="highlight"></pre>
    <textarea id="editor" spellcheck="false"></textarea>
  </div>
</div>

<pre id="console"></pre>

<script>
let editor, highlight, lines, consoleBox, fileInput, filename;

/* INIT */
window.onload = () => {

  editor = document.getElementById("editor");
  highlight = document.getElementById("highlight");
  lines = document.getElementById("lineNums");
  consoleBox = document.getElementById("console");
  fileInput = document.getElementById("fileInput");
  filename = document.getElementById("filename");

  fileInput.addEventListener("change", openFile);

  /* LOAD STORAGE */
  const savedCode = localStorage.getItem("arduino_code");
  const savedName = localStorage.getItem("arduino_name");

  if(savedCode){
    editor.value = savedCode;
    filename.value = savedName || "project";
  } else {
    editor.value = defaultSketch();
  }

  updateAll();

  /* INPUT */
  editor.addEventListener("input", () => {
    updateAll();
    saveLocal();
  });

  /* SCROLL SYNC */
  editor.addEventListener("scroll", () => {
    highlight.scrollTop = editor.scrollTop;
    highlight.scrollLeft = editor.scrollLeft;
    lines.scrollTop = editor.scrollTop;
  });
};

/* DEFAULT */
function defaultSketch(){
return `void setup(){
  pinMode(LED_BUILTIN, OUTPUT);
}

void loop(){
  digitalWrite(LED_BUILTIN, HIGH);
  delay(1000);
  digitalWrite(LED_BUILTIN, LOW);
  delay(1000);
}`;
}

/* UPDATE */
function updateAll(){
  updateLines();
  highlightCode();
}

/* LINES */
function updateLines(){
  const count = editor.value.split("\n").length;
  lines.innerHTML = Array.from({length:count},(_,i)=>i+1).join("<br>");
}

/* SYNTAX */
function highlightCode(){
  let code = editor.value
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")

    .replace(/(\/\/.*)/g,'<span style="color:#22c55e">$1</span>')
    .replace(/\b(void|int|setup|loop|digitalWrite|delay|pinMode)\b/g,
      '<span style="color:#38bdf8">$1</span>')
.replace(/\b(Serial|begin|println|millis|analogRead|analogWrite)\b/g,
  '<span style="color:#38bdf8">$1</span>')
.replace(/(#include\s*&lt;.*?&gt;)/g,
  '<span style="color:#f472b6">$1</span>')
.replace(/\b(#define|#include)\b/g,
  '<span style="color:#f472b6">$1</span>')
.replace(/\b(Adafruit_SSD1306|Adafruit_GFX|Wire)\b/g,
  '<span style="color:#60a5fa">$1</span>')
.replace(/\b(SSD1306_SWITCHCAPVCC|WHITE|BLACK)\b/g,
  '<span style="color:#22c55e">$1</span>')
.replace(/\b(display)\b/g,
  '<span style="color:#e879f9">$1</span>')
    .replace(/\b(HIGH|LOW|OUTPUT|INPUT)\b/g,
      '<span style="color:#fbbf24">$1</span>')
    .replace(/\b(\d+)\b/g,
      '<span style="color:#a78bfa">$1</span>');

  highlight.innerHTML = code;
}

/* STORAGE */
function saveLocal(){
  localStorage.setItem("arduino_code", editor.value);
  localStorage.setItem("arduino_name", filename.value);
}

/* NEW */
function newProject(){
  editor.value = "";
  filename.value = "project";
  localStorage.removeItem("arduino_code"); // 🔥 prevent restore bug
  updateAll();
}

/* SAVE FILE */
function saveFile(){
  saveLocal();

  const name = filename.value || "project";
  const blob = new Blob([editor.value], {type:"text/plain"});
  const a = document.createElement("a");

  a.href = URL.createObjectURL(blob);
  a.download = name + ".ino";
  a.click();
}

/* OPEN FILE */
function openFile(e){
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    editor.value = reader.result;
    filename.value = file.name.replace(/\..+$/, "");
    updateAll();
    saveLocal();
  };

  reader.readAsText(file);
}

function safeCompilePing(){
  if(!editor) return;

  fetch("https://arduino-guide-6.onrender.com/compile", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      code: editor.value
    })
  })
  .then(res => res.json())
  .then(data => {
    console.log("OUTPUT:", data.output);
  });
}

/* COMPILE */
async function compileCode(){

    consoleBox.textContent = "Compiling...";

    try{

        const res = await fetch(
            "https://arduino-guide-6.onrender.com/compile",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    code:editor.value,
                    name:filename.value
                })
            }
        );

        const data = await res.json();

        const output = data.output || "No output";

        consoleBox.textContent = output;

        /*
        ========================================================
        SAVE COMPILED SNAPSHOT
        ========================================================
        */

        if(data.success){

            localStorage.setItem(
                "arduino_compiled",
                output
            );

            /*
            Save the exact source that was compiled.
            View uses this ONLY as the compiled snapshot.
            */

            localStorage.setItem(
                "arduino_compiled_code",
                editor.value
            );

            localStorage.setItem(
                "arduino_compiled_name",
                filename.value
            );

            localStorage.setItem(
                "arduino_compile_success",
                "true"
            );

        }else{

            localStorage.setItem(
                "arduino_compile_success",
                "false"
            );

        }

    }catch(error){

        consoleBox.textContent = "Server error";

        localStorage.setItem(
            "arduino_compile_success",
            "false"
        );
    }
}


/* ================= EXAMPLES (FIXED ALL) ================= */
function loadExample(name){

  const ex = {

    blink:`void setup(){
  pinMode(LED_BUILTIN, OUTPUT);
}
void loop(){
  digitalWrite(LED_BUILTIN, HIGH);
  delay(1000);
  digitalWrite(LED_BUILTIN, LOW);
  delay(1000);
}`,

    button:`void setup(){
  pinMode(2, INPUT);
}
void loop(){
  int v = digitalRead(2);
}`,

    "button-led":`void setup(){
  pinMode(2, INPUT);
  pinMode(13, OUTPUT);
}
void loop(){
  digitalWrite(13, digitalRead(2));
}`,

    pwm:`void setup(){
  pinMode(9, OUTPUT);
}
void loop(){
  analogWrite(9, 128);
}`,

    "multi-led":`void setup(){
  pinMode(11, OUTPUT);
  pinMode(12, OUTPUT);
  pinMode(13, OUTPUT);
}
void loop(){
  digitalWrite(11, HIGH);
  digitalWrite(12, LOW);
  digitalWrite(13, HIGH);
}`,

    buzzer:`void setup(){
  pinMode(6, OUTPUT);
}
void loop(){
  tone(6, 1000);
  delay(500);
  noTone(6);
  delay(500);
}`,

    analog:`void setup(){
  Serial.begin(9600);
}
void loop(){
  Serial.println(analogRead(A0));
  delay(200);
}`,

    joystick:`void setup(){
  Serial.begin(9600);
}
void loop(){
  int x = analogRead(A0);
  int y = analogRead(A1);
  int b = digitalRead(2);
  Serial.println(String(x)+" "+String(y)+" "+String(b));
}`,

    serial:`void setup(){
  Serial.begin(9600);
}
void loop(){
  Serial.println("Hello");
  delay(1000);
}`,

    timer:`unsigned long t=0;
void setup(){
  pinMode(13,OUTPUT);
}
void loop(){
  if(millis()-t>1000){
    t=millis();
    digitalWrite(13,!digitalRead(13));
  }
}`
  };

  if(!ex[name]) {
    consoleBox.textContent = "Example not found: " + name;
    return;
  }

  editor.value = ex[name];
  filename.value = name;

  updateLines();
  highlightCode();
saveLocal();
}


</script>
<script type="module" src="js/Live.js"></script>

</body>
</html>
