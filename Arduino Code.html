<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Arduino IDE Web</title>

<style>
body{
  margin:0;
  font-family:monospace;
  background:#0b0f1a;
  color:white;
}

header{
  display:flex;
  gap:10px;
  padding:10px;
  background:#111827;
  align-items:center;
}

button{
  background:#1f2a44;
  color:white;
  border:none;
  padding:6px 10px;
  cursor:pointer;
}

button:hover{background:#2c3e66}

#editorWrap{
  display:flex;
  height:calc(100vh - 120px);
}

#lineNums{
  width:40px;
  background:#0f172a;
  padding:10px;
  color:#666;
  text-align:right;
}

textarea{
  flex:1;
  background:#0b0f1a;
  color:#00ff99;
  border:none;
  outline:none;
  padding:10px;
  font-size:14px;
}

#console{
  height:120px;
  background:#575251;
  color:#0f0;
  overflow:auto;
  padding:10px;
}
select{
  background:#111827;
  color:white;
}

::-webkit-scrollbar{display:none}
</style>

</head>

<body>
<input type="file" id="fileInput" style="display:none" accept=".ino,.txt">
<header>

<button onclick="newProject()">New</button>

<button onclick="document.getElementById('fileInput').click()">Open</button>

<button onclick="saveFile()">Save</button>

<button onclick="compileCode()">Compile</button>

<button onclick="uploadCode()">Upload</button>

<select id="portSelect">
  <option value="COM3">COM3</option>
  <option value="COM4">COM4</option>
  <option value="COM5">COM5</option>
  <option value="COM6">COM6</option>
  <option value="COM7">COM7</option>
  <option value="COM8">COM8</option>
  <option value="COM9">COM9</option>
</select>

<select id="board">
  <option value="arduino:avr:uno">UNO</option>
  <option value="arduino:avr:nano">NANO</option>
  <option value="arduino:avr:mega">MEGA</option>
</select>

<select id="examples" onchange="loadExample(this.value)">
  <option value="">Examples</option>
  <option value="blink">Blink</option>
  <option value="button">Button</option>
  <option value="button-led">Button LED</option>
  <option value="pwm">PWM</option>
  <option value="multi-led">Multi LED</option>
  <option value="buzzer">Buzzer</option>
  <option value="analog">Analog</option>
  <option value="joystick">Joystick</option>
  <option value="serial">Serial</option>
  <option value="timer">Timer</option>
</select>

<input id="filename" value="project">
<button onclick="location.href='Arduino Guide.html#home'">Home</button>
<button onclick="location.href='Examples.html#examples'">Examples</button>
<button onclick="location.href='Arduino Quiz.html'">Quizes</button>
<button onclick="location.href='Arduino Tutorial.html#home'">Tutorials</button>
<button onclick="location.href='Arduino Community.html'">Community</button>
</header>

<div id="editorWrap">
  <div id="lineNums"></div>
  <textarea id="editor"></textarea>
</div>

<pre id="console"></pre>

<script>
/* =========================
   SAFE STATE
========================= */

let editor, lines, consoleBox, portSelect, board, fileInput, filename;
function showPopup(){
  document.getElementById("exePopup").style.display = "flex";
}

function closePopup(){
  document.getElementById("exePopup").style.display = "none";
}

function downloadEXE(){
  window.location.href = "https://arduino-guide-6.onrender.com/download-exe";
}
/* ================= SAFE FETCH ================= */
async function safeFetch(url, options){
  try{
    const res = await fetch(url, options);
    return await res.json();
  }catch(err){
    console.error("Fetch error:", err);
    return null;
  }
}

/* ================= INIT ================= */
window.addEventListener("load", () => {

  editor = document.getElementById("editor");
  lines = document.getElementById("lineNums");
  consoleBox = document.getElementById("console");
  portSelect = document.getElementById("portSelect");
  board = document.getElementById("board");
  fileInput = document.getElementById("fileInput");
  filename = document.getElementById("filename");

  if(!editor || !lines || !consoleBox || !portSelect || !board){
    console.error("Missing elements");
    return;
  }

  editor.addEventListener("input", updateLines);

  editor.value = defaultSketch();
  updateLines();

  loadPorts();
});

/* ================= DEFAULT SKETCH ================= */
function defaultSketch(){
  return `void setup(){
  pinMode(LED_BUILTIN, OUTPUT);
}

void loop(){
  digitalWrite(LED_BUILTIN, HIGH);
  delay(1000);
  digitalWrite(LED_BUILTIN, LOW);
  delay(1000);
}`;
}

/* ================= LINE NUMBERS ================= */
function updateLines(){
  if(!editor || !lines) return;

  const count = editor.value.split("\n").length;
  lines.innerHTML = Array.from({length:count},(_,i)=>i+1).join("<br>");
}

/* ================= COMPILE ================= */
async function compileCode(){

  consoleBox.textContent = "Compiling...";

  const res = await safeFetch("https://arduino-guide-6.onrender.com/compile", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      code: editor.value,
      board: board.value,
      name: filename.value || "project"
    })
  });

  if(!res){
    consoleBox.textContent = "Server error";
    return;
  }

  consoleBox.textContent = res.output || "";

  // 🔥 DOWNLOAD HEX IF EXISTS
if(res.hex_path){
  window.location.href =
    "https://arduino-guide-6.onrender.com/download-hex?path=" +
    encodeURIComponent(res.hex_path);
}
}


/* ================= UPLOAD ================= */
async function uploadCode(){

  showPopup();
}

/* ================= PORTS (FIXED SAFE) ================= */
async function loadPorts(){

  if(!portSelect) return;

  const data = await safeFetch("https://arduino-guide-6.onrender.com/ports");

  const fallback = [
    "COM3","COM4","COM5","COM6","COM7","COM8","COM9"
  ];

  portSelect.innerHTML = "";

  let list = fallback;

  if(data && data.success && Array.isArray(data.ports) && data.ports.length){
    list = data.ports.map(p => p.port || "COM3");
  }

  list.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p;
    opt.textContent = p;
    portSelect.appendChild(opt);
  });
}

/* ================= NEW ================= */
function newProject(){
  if(confirm("Clear code?")){
    editor.value = "";
    filename.value = "project";
    updateLines();
  }
}

/* ================= SAVE ================= */
function saveFile(){
  const name = (filename.value || "project").replace(/[^a-zA-Z0-9_-]/g, "");

  const blob = new Blob([editor.value], {type:"text/plain"});
  const a = document.createElement("a");

  a.href = URL.createObjectURL(blob);
  a.download = name + ".ino";

  a.click();
}

/* ================= OPEN ================= */
function openFile(e){
  const file = e.target.files?.[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    editor.value = reader.result;
    filename.value = file.name.replace(/\.(ino|txt)$/,"");
    updateLines();
    highlightCode(); // refresh highlight
  };

  reader.readAsText(file);
}

/* bind safely */
fileInput.addEventListener("change", openFile);

function highlightCode(){

  if(!editor) return;

  let code = editor.value;

  // ---- SIMPLE ERROR CHECKS ----
  let errors = [];

  if(code.includes("void loop") && !code.includes("{")){
    errors.push("Missing { in loop()");
  }

  if(code.includes("pinMode") && !code.includes("setup")){
    errors.push("pinMode used outside setup()");
  }

  if((code.match(/\{/g)||[]).length !== (code.match(/\}/g)||[]).length){
    errors.push("Brackets { } mismatch");
  }

  consoleBox.textContent = errors.length
    ? "⚠ Errors:\n" + errors.join("\n")
    : "✔ No errors detected";

  // ---- SYNTAX HIGHLIGHT ----
  let html = code
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")

    .replace(/(\/\/.*)/g,'<span style="color:#22c55e">$1</span>')
    .replace(/\b(void|int|pinMode|digitalWrite|delay|Serial|setup|loop|tone|noTone|analogWrite|digitalRead|millis)\b/g,
      '<span style="color:#38bdf8">$1</span>')
    .replace(/\b(HIGH|LOW|INPUT|OUTPUT|INPUT_PULLUP)\b/g,
      '<span style="color:#fbbf24">$1</span>')
    .replace(/\b(\d+)\b/g,
      '<span style="color:#a78bfa">$1</span>');

  document.getElementById("highlight").innerHTML = html;
}
function downloadEXE(){
  window.location.href = "https://arduino-guide-6.onrender.com/download-exe";
}
/* ================= EXAMPLES (FIXED ALL) ================= */
function loadExample(name){

  const ex = {

    blink:`void setup(){
  pinMode(LED_BUILTIN, OUTPUT);
}
void loop(){
  digitalWrite(LED_BUILTIN, HIGH);
  delay(1000);
  digitalWrite(LED_BUILTIN, LOW);
  delay(1000);
}`,

    button:`void setup(){
  pinMode(2, INPUT);
}
void loop(){
  int v = digitalRead(2);
}`,

    "button-led":`void setup(){
  pinMode(2, INPUT);
  pinMode(13, OUTPUT);
}
void loop(){
  digitalWrite(13, digitalRead(2));
}`,

    pwm:`void setup(){
  pinMode(9, OUTPUT);
}
void loop(){
  analogWrite(9, 128);
}`,

    "multi-led":`void setup(){
  pinMode(11, OUTPUT);
  pinMode(12, OUTPUT);
  pinMode(13, OUTPUT);
}
void loop(){
  digitalWrite(11, HIGH);
  digitalWrite(12, LOW);
  digitalWrite(13, HIGH);
}`,

    buzzer:`void setup(){
  pinMode(6, OUTPUT);
}
void loop(){
  tone(6, 1000);
  delay(500);
  noTone(6);
  delay(500);
}`,

    analog:`void setup(){
  Serial.begin(9600);
}
void loop(){
  Serial.println(analogRead(A0));
  delay(200);
}`,

    joystick:`void setup(){
  Serial.begin(9600);
}
void loop(){
  int x = analogRead(A0);
  int y = analogRead(A1);
  int b = digitalRead(2);
  Serial.println(String(x)+" "+String(y)+" "+String(b));
}`,

    serial:`void setup(){
  Serial.begin(9600);
}
void loop(){
  Serial.println("Hello");
  delay(1000);
}`,

    timer:`unsigned long t=0;
void setup(){
  pinMode(13,OUTPUT);
}
void loop(){
  if(millis()-t>1000){
    t=millis();
    digitalWrite(13,!digitalRead(13));
  }
}`
  };

  if(!ex[name]) {
    consoleBox.textContent = "Example not found: " + name;
    return;
  }

  editor.value = ex[name];
  filename.value = name;

  updateLines();
  highlightCode(); // IMPORTANT FIX
}

fetch("https://arduino-guide-6.onrender.com/compile", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        code: editor.getValue()
    })
})
.then(res => res.json())
.then(data => {
    console.log("OUTPUT:", data.output);
});
</script>
