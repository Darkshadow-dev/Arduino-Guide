<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="Images/Website-Guide.png">
<title>Arduino IDE Web</title>

<style>
body{
  margin:0;
  font-family:monospace;
  background:#0b0f1a;
  color:white;
}

header{
  display:flex;
  gap:10px;
  padding:10px;
  background:#111827;
  align-items:center;
}

button{
  background:#1f2a44;
  color:white;
  border:none;
  padding:6px 10px;
  cursor:pointer;
}

button:hover{background:#2c3e66}

#editorWrap{
  display:flex;
  height:calc(100vh - 120px);
}
#editorBox{
  position:relative;
  flex:1;
}

#editor, #highlight{
  position:absolute;
  inset:0;

  font-family: monospace;
  font-size: 14px;
  line-height: 1.4;

  padding:10px;

  white-space: pre;        /* 🔥 SAME rendering */
  overflow: auto;

  margin:0;
  border:none;
}

#highlight{
  pointer-events:none;
  color:white;
  z-index:1;
}

#editor{
  background:transparent;
  color:transparent;
  caret-color:#00ff99;
  z-index:2;
  resize:none;
}

#lineNums{
  width:40px;
  background:#0f172a;

  padding:10px 5px;   /* match editor padding */

  color:#666;
  text-align:right;

  font-family: monospace;
  font-size:14px;
  line-height:1.4;    /*MUST MATCH editor */

  user-select:none;
}

#console{
  height:120px;
  background:#575251;
  color:#0f0;
  overflow:auto;
  padding:10px;
}
select{
  background:#111827;
  color:white;
}

::-webkit-scrollbar{display:none}
#highlight, #editor {
  tab-size: 2;
}

</style>

</head>

<body>
<input type="file" id="fileInput" style="display:none" accept=".ino,.txt,.cpp,.h,.c">
<header>

<button onclick="newProject()">New</button>

<button onclick="document.getElementById('fileInput').click()">Open</button>

<button onclick="saveFile()">Save</button>

<button onclick="compileCode()">Compile</button>

<select id="examples" onchange="loadExample(this.value)">
  <option value="">Examples</option>
  <option value="blink">Blink</option>
  <option value="button">Button</option>
  <option value="button-led">Button LED</option>
  <option value="pwm">PWM</option>
  <option value="multi-led">Multi LED</option>
  <option value="buzzer">Buzzer</option>
  <option value="analog">Analog</option>
  <option value="joystick">Joystick</option>
  <option value="serial">Serial</option>
  <option value="timer">Timer</option>
</select>

<input id="filename" value="project">
<button onclick="location.href='Arduino Guide.html#home'">Home</button>
<button onclick="location.href='Examples.html#examples'">Examples</button>
<button onclick="location.href='Arduino Quiz.html'">Quizes</button>
<button onclick="location.href='Arduino Tutorial.html#home'">Tutorials</button>
<button onclick="location.href='Arduino Community.html'">Community</button>
</header>

<div id="editorWrap">
  <div id="lineNums">
</div>
<div id="editorBox">
  <pre id="highlight"></pre>
  <textarea id="editor" spellcheck="false"></textarea>
</div>
</div>

<pre id="console"></pre>

<script>
/* =========================
   SAFE STATE
========================= */

let editor, lines, consoleBox, fileInput, filename;

/* ================= SAFE FETCH ================= */
async function safeFetch(url, options){
  try{
    const res = await fetch(url, options);
    return await res.json();
  }catch(err){
    console.error("Fetch error:", err);
    return null;
  }
}

/* ================= INIT ================= */
window.addEventListener("load", () => {

  editor = document.getElementById("editor");
  lines = document.getElementById("lineNums");
  consoleBox = document.getElementById("console");
fileInput = document.getElementById("fileInput");
  filename = document.getElementById("filename");

  if(!editor || !lines || !consoleBox){
    console.error("Missing elements");
    return;
  }
editor.addEventListener("input", () => {
  updateLines();
  highlightCode();
});

  editor.value = defaultSketch();
  updateLines();
  highlightCode();
});

/* ================= DEFAULT SKETCH ================= */
function defaultSketch(){
  return `void setup(){
  pinMode(LED_BUILTIN, OUTPUT);
}

void loop(){
  digitalWrite(LED_BUILTIN, HIGH);
  delay(1000);
  digitalWrite(LED_BUILTIN, LOW);
  delay(1000);
}`;
}
const highlight = document.getElementById("highlight");

editor.addEventListener("scroll", () => {
  highlight.scrollTop = editor.scrollTop;
  highlight.scrollLeft = editor.scrollLeft;
  lines.scrollTop = editor.scrollTop;
});
/* ================= LINE NUMBERS ================= */
function updateLines(){
  if(!editor || !lines) return;

  const count = editor.value.split("\n").length;
  lines.innerHTML = Array.from({length:count},(_,i)=>i+1).join("<br>");
}

/* ================= COMPILE ================= */
async function compileCode(){

  consoleBox.textContent = "Compiling...";

  const res = await safeFetch("https://arduino-guide-6.onrender.com/compile", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      code: editor.value,
      name: filename.value || "project"
    })
  });

  if(!res){
    consoleBox.textContent = "Server error";
    return;
  }

  consoleBox.textContent = res.output || "";
}

/* ================= NEW ================= */
function newProject(){
  if(confirm("Clear code?")){
    editor.value = "";
    filename.value = "project";
    updateLines();
  }
}

/* ================= SAVE ================= */
function saveFile(){
  const name = (filename.value || "project").replace(/[^a-zA-Z0-9_-]/g, "");

  // -------------------------
  // 1. download .ino
  // -------------------------
  const inoBlob = new Blob([editor.value], {type:"text/plain"});
  const inoLink = document.createElement("a");

  inoLink.href = URL.createObjectURL(inoBlob);
  inoLink.download = name + ".ino";
  inoLink.click();
}

function openFile(e){
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    editor.value = reader.result;
    filename.value = file.name.replace(/\.[^/.]+$/, "");

    updateLines();
    highlightCode();

    fileInput.value = ""; // 🔥 FIX (allows reopening same file)
  };

  reader.readAsText(file);

  updateLines();
  highlightCode();
}

function highlightCode(){
  let code = editor.value;

  let html = code
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")

    .replace(/(\/\/.*)/g,'<span style="color:#22c55e">$1</span>')
    .replace(/\b(void|int|pinMode|digitalWrite|delay|Serial|setup|loop|tone|noTone|analogWrite|digitalRead|millis)\b/g,
      '<span style="color:#38bdf8">$1</span>')
    .replace(/\b(HIGH|LOW|INPUT|OUTPUT|INPUT_PULLUP)\b/g,
      '<span style="color:#fbbf24">$1</span>')
    .replace(/\b(\d+)\b/g,
      '<span style="color:#a78bfa">$1</span>');
document.getElementById("highlight").innerHTML = html;
}
/* ================= EXAMPLES (FIXED ALL) ================= */
function loadExample(name){

  const ex = {

    blink:`void setup(){
  pinMode(LED_BUILTIN, OUTPUT);
}
void loop(){
  digitalWrite(LED_BUILTIN, HIGH);
  delay(1000);
  digitalWrite(LED_BUILTIN, LOW);
  delay(1000);
}`,

    button:`void setup(){
  pinMode(2, INPUT);
}
void loop(){
  int v = digitalRead(2);
}`,

    "button-led":`void setup(){
  pinMode(2, INPUT);
  pinMode(13, OUTPUT);
}
void loop(){
  digitalWrite(13, digitalRead(2));
}`,

    pwm:`void setup(){
  pinMode(9, OUTPUT);
}
void loop(){
  analogWrite(9, 128);
}`,

    "multi-led":`void setup(){
  pinMode(11, OUTPUT);
  pinMode(12, OUTPUT);
  pinMode(13, OUTPUT);
}
void loop(){
  digitalWrite(11, HIGH);
  digitalWrite(12, LOW);
  digitalWrite(13, HIGH);
}`,

    buzzer:`void setup(){
  pinMode(6, OUTPUT);
}
void loop(){
  tone(6, 1000);
  delay(500);
  noTone(6);
  delay(500);
}`,

    analog:`void setup(){
  Serial.begin(9600);
}
void loop(){
  Serial.println(analogRead(A0));
  delay(200);
}`,

    joystick:`void setup(){
  Serial.begin(9600);
}
void loop(){
  int x = analogRead(A0);
  int y = analogRead(A1);
  int b = digitalRead(2);
  Serial.println(String(x)+" "+String(y)+" "+String(b));
}`,

    serial:`void setup(){
  Serial.begin(9600);
}
void loop(){
  Serial.println("Hello");
  delay(1000);
}`,

    timer:`unsigned long t=0;
void setup(){
  pinMode(13,OUTPUT);
}
void loop(){
  if(millis()-t>1000){
    t=millis();
    digitalWrite(13,!digitalRead(13));
  }
}`
  };

  if(!ex[name]) {
    consoleBox.textContent = "Example not found: " + name;
    return;
  }

  editor.value = ex[name];
  filename.value = name;

  updateLines();
  highlightCode();
}

fetch("https://arduino-guide-6.onrender.com/compile", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        code: editor.getValue()
    })
})
.then(res => res.json())
.then(data => {
    console.log("OUTPUT:", data.output);
});
</script>

</body>
