<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="Images/Website-Guide.png">
<title>Arduino IDE Web</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  font-family:monospace;
  background:#0b0f1a;
  color:#fff;
  overflow:hidden;
}

button,
select,
input{
  font-family:inherit;
}

button{
  border:1px solid #263653;
  background:#172238;
  color:#fff;
  padding:7px 12px;
  border-radius:5px;
  cursor:pointer;
  transition:.15s;
}

button:hover{
  background:#243657;
  border-color:#3b5685;
}

button:active{
  transform:translateY(1px);
}

button.primary{
  background:#087f83;
  border-color:#0aaeb3;
}

button.primary:hover{
  background:#099da2;
}

button.success{
  background:#116b42;
  border-color:#18a865;
}

button.success:hover{
  background:#168653;
}

button.danger{
  background:#652c35;
  border-color:#98404c;
}

button.danger:hover{
  background:#7b3540;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

header{
  height:58px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 10px;
  background:#111827;
  border-bottom:1px solid #263044;
  white-space:nowrap;
  overflow-x:auto;
}

header::-webkit-scrollbar{
  height:0;
}

#brand{
  font-weight:bold;
  color:#00d8c9;
  padding:0 8px;
  margin-right:4px;
}

#filename{
  width:125px;
  padding:7px 9px;
  border:1px solid #263653;
  border-radius:5px;
  background:#0b1220;
  color:#fff;
  outline:none;
}

#filename:focus{
  border-color:#00aeb3;
}

.nav-separator{
  width:1px;
  height:26px;
  background:#2a354b;
  margin:0 3px;
}

#editorWrap{
  display:flex;
  height:calc(100vh - 178px);
  min-height:180px;
}

#lineNums{
  width:52px;
  flex-shrink:0;
  background:#0d1422;
  border-right:1px solid #202b3f;
  padding:10px 7px;
  color:#58657a;
  text-align:right;
  font-size:14px;
  line-height:1.4;
  overflow:hidden;
  user-select:none;
}

#editorBox{
  position:relative;
  flex:1;
  min-width:0;
  overflow:hidden;
}

#editor,
#highlight{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  margin:0;
  padding:10px 12px;
  border:0;
  outline:none;
  font-family:monospace;
  font-size:14px;
  line-height:1.4;
  white-space:pre;
  overflow:auto;
  tab-size:2;
}

#highlight{
  z-index:1;
  pointer-events:none;
  color:#d7e2f2;
}

#editor{
  z-index:2;
  resize:none;
  background:transparent;
  color:transparent;
  caret-color:#00ff99;
  overflow:auto;
}

#editor::selection{
  background:rgba(0,180,255,.25);
}

#highlight::-webkit-scrollbar,
#editor::-webkit-scrollbar{
  width:8px;
  height:8px;
}

#highlight::-webkit-scrollbar-thumb,
#editor::-webkit-scrollbar-thumb{
  background:#26344d;
  border-radius:4px;
}

#highlight::-webkit-scrollbar-track,
#editor::-webkit-scrollbar-track{
  background:#0b111d;
}

#bottomBar{
  height:120px;
  display:flex;
  flex-direction:column;
  background:#0d1420;
  border-top:1px solid #263044;
}

#consoleHeader{
  height:34px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  background:#111827;
  border-bottom:1px solid #263044;
  color:#aab7ca;
  font-size:13px;
}

#consoleTitle{
  display:flex;
  align-items:center;
  gap:8px;
}

#statusDot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#64748b;
}

#statusDot.success{
  background:#22c55e;
}

#statusDot.error{
  background:#ef4444;
}

#statusDot.running{
  background:#f59e0b;
}

#consoleButtons{
  display:flex;
  gap:5px;
}

#consoleButtons button{
  padding:3px 8px;
  font-size:12px;
}

#console{
  flex:1;
  margin:0;
  padding:8px 10px;
  overflow:auto;
  color:#b8ffcc;
  background:#080d15;
  font-size:13px;
  line-height:1.4;
  white-space:pre-wrap;
}

#liveCounter{
  margin-left:auto;
  color:#8ea0b9;
  font-size:12px;
  display:flex;
  align-items:center;
  gap:5px;
}

.live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 7px rgba(34,197,94,.7);
}

#compileInfo{
  color:#7890ad;
  font-size:12px;
  margin-left:5px;
}

@media(max-width:900px){
  #brand{
    display:none;
  }

  header{
    gap:5px;
  }

  #filename{
    width:105px;
  }
}

@media(max-width:650px){
  header{
    height:52px;
  }

  #editorWrap{
    height:calc(100vh - 172px);
  }

  #bottomBar{
    height:120px;
  }

  header button{
    padding:6px 8px;
  }

  #lineNums{
    width:42px;
    font-size:12px;
  }

  #editor,
  #highlight{
    font-size:13px;
  }
}
</style>

</head>

<body>

  <div id="brand">Arduino IDE Web</div>

<button onclick="newProject()">New</button> <button onclick="document.getElementById('fileInput').click()">Open</button> <button onclick="saveFile()">Save</button>

type="file"
id="fileInput"
style="display:none"
accept=".ino,.txt,.cpp,.h,.c"

>

<div id="editorWrap">

  <div id="lineNums"></div>

  <div id="editorBox">
    <pre id="highlight"></pre>
    <textarea id="editor" spellcheck="false"></textarea>
  </div>

</div>

<div id="bottomBar">

  <div id="consoleHeader">

```
<div id="consoleTitle">
  <span id="statusDot"></span>
  <span>Output</span>
  <span id="compileInfo"></span>
</div>

<div id="consoleButtons">
  <button onclick="clearConsole()">Clear</button>
  <button id="downloadHexButton" onclick="downloadHex()" disabled>
    Download HEX
  </button>
</div>
```

  </div>

  <pre id="console"></pre>

</div>

<script>

const API = "https://arduino-guide-6.onrender.com";

let editor;
let highlight;
let lines;
let consoleBox;
let fileInput;
let filename;
let statusDot;
let compileInfo;
let downloadHexButton;

let lastHexUrl = null;


/* =========================
   INIT
========================= */

window.onload = () => {

  editor = document.getElementById("editor");
  highlight = document.getElementById("highlight");
  lines = document.getElementById("lineNums");
  consoleBox = document.getElementById("console");
  fileInput = document.getElementById("fileInput");
  filename = document.getElementById("filename");
  statusDot = document.getElementById("statusDot");
  compileInfo = document.getElementById("compileInfo");
  downloadHexButton = document.getElementById("downloadHexButton");

  fileInput.addEventListener("change", openFile);

  const savedCode = localStorage.getItem("arduino_code");
  const savedName = localStorage.getItem("arduino_name");

  if(savedCode){
    editor.value = savedCode;
    filename.value = savedName || "project";
  }else{
    editor.value = defaultSketch();
  }

  updateAll();

  editor.addEventListener("input", () => {
    updateAll();
    saveLocal();

    setStatus("idle");
  });

  editor.addEventListener("scroll", syncScroll);

  editor.addEventListener("keydown", handleEditorKeys);

  setStatus("idle");
};


/* =========================
   NAVIGATION
========================= */

function go(url){
  window.location.href = url;
}


/* =========================
   DEFAULT SKETCH
========================= */

function defaultSketch(){
  return `void setup(){
  pinMode(LED_BUILTIN, OUTPUT);
}

void loop(){
  digitalWrite(LED_BUILTIN, HIGH);
  delay(1000);
  digitalWrite(LED_BUILTIN, LOW);
  delay(1000);
}`;
}


/* =========================
   EDITOR
========================= */

function updateAll(){
  updateLines();
  highlightCode();
}

function updateLines(){

  const count = Math.max(
    1,
    editor.value.split("\n").length
  );

  lines.innerHTML = Array
    .from({length:count}, (_, i) => i + 1)
    .join("<br>");
}

function syncScroll(){

  highlight.scrollTop = editor.scrollTop;
  highlight.scrollLeft = editor.scrollLeft;
  lines.scrollTop = editor.scrollTop;
}

function handleEditorKeys(e){

  if(e.key === "Tab"){

    e.preventDefault();

    const start = editor.selectionStart;
    const end = editor.selectionEnd;

    editor.value =
      editor.value.substring(0, start) +
      "  " +
      editor.value.substring(end);

    editor.selectionStart = start + 2;
    editor.selectionEnd = start + 2;

    updateAll();
    saveLocal();
  }
}


/* =========================
   SYNTAX HIGHLIGHTING
========================= */

function highlightCode(){

  let code = editor.value
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  const tokens = [];

  const save = html => {

    const id = `___TOKEN_${tokens.length}___`;

    tokens.push(html);

    return id;
  };


  /* Comments */

  code = code.replace(
    /(\/\/.*)$/gm,
    m => save(`<span style="color:#22c55e">${m}</span>`)
  );

  code = code.replace(
    /(\/\*[\s\S]*?\*\/)/g,
    m => save(`<span style="color:#22c55e">${m}</span>`)
  );


  /* Strings */

  code = code.replace(
    /("(?:\\.|[^"\\])*")/g,
    m => save(`<span style="color:#f59e0b">${m}</span>`)
  );

  code = code.replace(
    /('(?:\\.|[^'\\])*')/g,
    m => save(`<span style="color:#f59e0b">${m}</span>`)
  );


  /* Preprocessor */

  code = code.replace(
    /(#(?:include|define|if|ifdef|ifndef|else|elif|endif|pragma|undef|error|warning)\b[^\n]*)/g,
    m => save(`<span style="color:#f472b6">${m}</span>`)
  );


  /* Arduino functions */

  code = code.replace(
    /\b(pinMode|digitalWrite|digitalRead|analogRead|analogWrite|delay|delayMicroseconds|millis|micros)\b/g,
    '<span style="color:#38bdf8">$1</span>'
  );


  /* Serial */

  code = code.replace(
    /\b(Serial|Serial1|Serial2|Serial3|begin|end|available|read|write|print|println|printf|flush)\b/g,
    '<span style="color:#38bdf8">$1</span>'
  );


  /* Special functions */

  code = code.replace(
    /\b(attachInterrupt|detachInterrupt|interrupts|noInterrupts|tone|noTone|pulseIn|pulseInLong|shiftIn|shiftOut)\b/g,
    '<span style="color:#38bdf8">$1</span>'
  );


  /* Constants */

  code = code.replace(
    /\b(HIGH|LOW|INPUT|OUTPUT|INPUT_PULLUP|LED_BUILTIN|DEFAULT|INTERNAL|INTERNAL1V1|INTERNAL2V56)\b/g,
    '<span style="color:#fbbf24">$1</span>'
  );


  /* Hardware */

  code = code.replace(
    /\b(A[0-5]|SDA|SCL|MOSI|MISO|SCK|SS|RX|TX|AREF|RESET)\b/g,
    '<span style="color:#60a5fa">$1</span>'
  );


  /* Types */

  code = code.replace(
    /\b(void|bool|boolean|char|byte|short|int|long|unsigned|signed|float|double|string|String|size_t|uint8_t|uint16_t|uint32_t|int8_t|int16_t|int32_t)\b/g,
    '<span style="color:#c084fc">$1</span>'
  );


  /* Keywords */

  code = code.replace(
    /\b(if|else|for|while|do|switch|case|break|continue|return|goto|const|static|volatile|extern|struct|class|public|private|protected|new|delete|true|false|nullptr)\b/g,
    '<span style="color:#fb7185">$1</span>'
  );


  /* Libraries */

  code = code.replace(
    /\b(Wire|SPI|EEPROM|Servo|SoftwareSerial|Adafruit_GFX|Adafruit_SSD1306|LiquidCrystal|DHT|OneWire|DallasTemperature|SD|WiFi|Ethernet|Stepper)\b/g,
    '<span style="color:#60a5fa">$1</span>'
  );


  /* Objects */

  code = code.replace(
    /\b(display|Serial|Wire|lcd|servo|sensor|oled|screen)\b/g,
    '<span style="color:#e879f9">$1</span>'
  );


  /* Math */

  code = code.replace(
    /\b(abs|min|max|constrain|map|pow|sqrt|sin|cos|tan|random|randomSeed)\b/g,
    '<span style="color:#2dd4bf">$1</span>'
  );


  /* C/C++ functions */

  code = code.replace(
    /\b(sizeof|memcpy|memset|strcmp|strlen|strcpy|atoi|atof)\b/g,
    '<span style="color:#2dd4bf">$1</span>'
  );


  /* Numbers */

  code = code.replace(
    /\b(0[xX][0-9a-fA-F]+|\d+(?:\.\d+)?[fFlLuU]*)\b/g,
    '<span style="color:#a78bfa">$1</span>'
  );


  /* Restore protected */

  code = code.replace(
    /___TOKEN_(\d+)___/g,
    (_, i) => tokens[i]
  );


  highlight.innerHTML = code;
}


/* =========================
   LOCAL STORAGE
========================= */

function saveLocal(){

  localStorage.setItem(
    "arduino_code",
    editor.value
  );

  localStorage.setItem(
    "arduino_name",
    filename.value
  );
}


/* =========================
   NEW PROJECT
========================= */

function newProject(){

  editor.value = defaultSketch();

  filename.value = "project";

  localStorage.removeItem("arduino_compiled");
  localStorage.removeItem("arduino_compiled_code");
  localStorage.removeItem("arduino_compiled_name");
  localStorage.removeItem("arduino_compile_success");

  lastHexUrl = null;

  downloadHexButton.disabled = true;

  updateAll();
  saveLocal();

  consoleBox.textContent =
    "New project created.\n\nReady.";
  
  setStatus("idle");
}


/* =========================
   SAVE FILE
========================= */

function saveFile(){

  saveLocal();

  const name =
    sanitizeName(filename.value) || "project";

  const blob =
    new Blob(
      [editor.value],
      {type:"text/plain"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;
  a.download = name + ".ino";

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(
    () => URL.revokeObjectURL(url),
    1000
  );
}


/* =========================
   OPEN FILE
========================= */

function openFile(e){

  const file =
    e.target.files[0];

  if(!file){
    return;
  }

  const reader =
    new FileReader();

  reader.onload = () => {

    editor.value =
      reader.result;

    filename.value =
      file.name.replace(/\..+$/, "");

    updateAll();
    saveLocal();

    consoleBox.textContent =
      "Loaded: " + file.name;

    setStatus("idle");
  };

  reader.readAsText(file);

  fileInput.value = "";
}


/* =========================
   COMPILE
========================= */

async function compileCode(){

  const code = editor.value;

  if(!code.trim()){

    consoleBox.textContent =
      "Nothing to compile.";

    setStatus("error");

    return;
  }


  const name =
    sanitizeName(filename.value) || "project";


  consoleBox.textContent =
    "Compiling " + name + "...\n\n" +
    "Connecting to Arduino Guide build server...";

  compileInfo.textContent =
    "Compiling";

  setStatus("running");

  downloadHexButton.disabled = true;

  lastHexUrl = null;


  try{

    const res =
      await fetch(
        API + "/compile",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            code:code,
            name:name,
            board:"arduino:avr:uno"
          })
        }
      );


    const data =
      await res.json();


    if(data.success){

      let output =
        "=== COMPILE SUCCESS ===\n\n";

      output +=
        data.output ||
        "Compilation completed successfully.";


      if(data.hex_url){

        output +=
          "\n\n=== HEX ===\n" +
          data.hex_url;

        lastHexUrl =
          data.hex_url;

        downloadHexButton.disabled = false;
      }


      consoleBox.textContent =
        output;

      compileInfo.textContent =
        "Success";

      setStatus("success");


      localStorage.setItem(
        "arduino_compiled",
        data.output || ""
      );

      localStorage.setItem(
        "arduino_compiled_code",
        code
      );

      localStorage.setItem(
        "arduino_compiled_name",
        name
      );

      localStorage.setItem(
        "arduino_compile_success",
        "true"
      );

    }else{

      const output =
        data.output ||
        data.error ||
        "Compilation failed.";

      consoleBox.textContent =
        "=== COMPILE FAILED ===\n\n" +
        output;

      compileInfo.textContent =
        "Failed";

      setStatus("error");

      localStorage.setItem(
        "arduino_compile_success",
        "false"
      );
    }

  }catch(error){

    consoleBox.textContent =
      "=== SERVER ERROR ===\n\n" +
      error.message +
      "\n\nCheck that the Render server is online.";

    compileInfo.textContent =
      "Server error";

    setStatus("error");

    localStorage.setItem(
      "arduino_compile_success",
      "false"
    );
  }
}


/* =========================
   DOWNLOAD HEX
========================= */

function downloadHex(){

  if(!lastHexUrl){

    consoleBox.textContent +=
      "\n\nNo HEX file is available.";

    return;
  }

  window.open(
    lastHexUrl,
    "_blank"
  );
}


/* =========================
   RUN SIMULATOR
========================= */

async function runSimulator(){

  const code =
    editor.value;

  if(!code.trim()){

    consoleBox.textContent =
      "Nothing to simulate.";

    setStatus("error");

    return;
  }


  consoleBox.textContent =
    "Creating GSE simulator...\n\n" +
    "Parsing Arduino source...";

  compileInfo.textContent =
    "Simulator";

  setStatus("running");


  try{

    const res =
      await fetch(
        API + "/create",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            code:code,
            name:filename.value,
            board:"arduino:avr:uno"
          })
        }
      );


    const data =
      await res.json();


    if(!res.ok || !data.success){

      throw new Error(
        data.error ||
        data.output ||
        "Failed to create simulator."
      );
    }


    consoleBox.textContent =
      "=== SIMULATOR READY ===\n\n" +
      "GSE executable created.\n" +
      "Opening Arduino Uno simulator...";


    setStatus("success");


    if(!data.url){

      throw new Error(
        "Server did not return a simulator URL."
      );
    }


    window.location.href =
      data.url;

  }catch(error){

    console.error(
      "Simulator error:",
      error
    );

    consoleBox.textContent =
      "=== SIMULATOR ERROR ===\n\n" +
      error.message;

    compileInfo.textContent =
      "Failed";

    setStatus("error");
  }
}


/* =========================
   EXAMPLES
========================= */

function loadExample(name){

  const ex = {

    blink:`void setup(){
  pinMode(LED_BUILTIN, OUTPUT);
}

void loop(){
  digitalWrite(LED_BUILTIN, HIGH);
  delay(1000);
  digitalWrite(LED_BUILTIN, LOW);
  delay(1000);
}`,

    button:`void setup(){
  pinMode(2, INPUT);
}

void loop(){
  int v = digitalRead(2);
}`,

    "button-led":`void setup(){
  pinMode(2, INPUT);
  pinMode(13, OUTPUT);
}

void loop(){
  digitalWrite(13, digitalRead(2));
}`,

    pwm:`void setup(){
  pinMode(9, OUTPUT);
}

void loop(){
  analogWrite(9, 128);
}`,

    "multi-led":`void setup(){
  pinMode(11, OUTPUT);
  pinMode(12, OUTPUT);
  pinMode(13, OUTPUT);
}

void loop(){
  digitalWrite(11, HIGH);
  digitalWrite(12, LOW);
  digitalWrite(13, HIGH);
}`,

    buzzer:`void setup(){
  pinMode(6, OUTPUT);
}

void loop(){
  tone(6, 1000);
  delay(500);
  noTone(6);
  delay(500);
}`,

    analog:`void setup(){
  Serial.begin(9600);
}

void loop(){
  Serial.println(analogRead(A0));
  delay(200);
}`,

    joystick:`void setup(){
  Serial.begin(9600);
}

void loop(){
  int x = analogRead(A0);
  int y = analogRead(A1);
  int b = digitalRead(2);

  Serial.println(String(x)+" "+String(y)+" "+String(b));
}`,

    serial:`void setup(){
  Serial.begin(9600);
}

void loop(){
  Serial.println("Hello");
  delay(1000);
}`,

    timer:`/*
  GSE FULL TEST PROGRAM

  Tests:
  - Built-in LED
  - Digital output pins
  - PWM output
  - Buzzer
  - Serial output
  - Repeated loop
*/

void setup(){

  Serial.begin(9600);

  pinMode(LED_BUILTIN, OUTPUT);

  pinMode(2, OUTPUT);
  pinMode(3, OUTPUT);
  pinMode(5, OUTPUT);
  pinMode(6, OUTPUT);

function sanitizeName(name){

  return String(name || "")
    .replace(/[^a-zA-Z0-9_-]/g, "")
    .trim();
}

function setStatus(type){

  statusDot.className = "";

  if(type === "success"){
    statusDot.classList.add("success");
  }

  if(type === "error"){
    statusDot.classList.add("error");
  }

  if(type === "running"){
    statusDot.classList.add("running");
  }

  if(type === "idle"){
    compileInfo.textContent = "";
  }
}

function clearConsole(){

  consoleBox.textContent = "";

  compileInfo.textContent = "";

  setStatus("idle");
}
